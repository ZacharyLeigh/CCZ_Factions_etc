#textdomain wesnoth-huvo

#define ABILITY_HEAL_12
    [heals]
        value=12
        id=healing
        affect_allies=yes
        name= _ "heals +12"
        female_name= _ "female^heals +12"
        description= _ "This unit uses ancient magic to heal units more quickly than is normally possible on the battlefield.

A unit cared for by this healer may heal up to 12 HP per turn, or be cured of poison."
        affect_self=no
        poison=slowed
        [affect_adjacent]
        [/affect_adjacent]
    [/heals]
#enddef

#define ABILITY_MOTH_TRANSFORMATION
[object]
    id=moth_form
    duration=forever
    [effect]
        apply_to=new_ability
        [abilities]
            [ability]
                id=moth_transformation
                name= _ "Moth Transformation"
                description= _ "This unit transforms between day and night forms at dawn and dusk."
            [/ability]
        [/abilities]
    [/effect]
[/object]

[event]
    name=new_turn
    [filter_condition]
        [variable]
            name=unit.variables.has_moth_transformation
            equals=yes
        [/variable]
    [/filter_condition]
    [store_time_of_day]
        variable=current_tod
    [/store_time_of_day]
    [if]
        [variable]
            name=current_tod.lawful_bonus
            less_than=0
        [/variable]
        [then]
            [if]
                [filter]
                    type=Lepidoptran Day
                [/filter]
                [then]
                    [transform_unit]
                        [filter]
                            x,y=$x1,$y1
                        [/filter]
                        target_type=Lepidoptran Night
                        animate=yes
                    [/transform_unit]
                [/then]
            [/if]
        [/then]
        [else]
            [variable]
                name=current_tod.lawful_bonus
                greater_than=0
            [/variable]
            [then]
                [if]
                    [filter]
                        type=Lepidoptran Night
                    [/filter]
                    [then]
                        [transform_unit]
                            [filter]
                                x,y=$x1,$y1
                            [/filter]
                            target_type=Lepidoptran Day
                            animate=yes
                        [/transform_unit]
                    [/then]
                [/if]
            [/then]
        [/else]
    [/if]
    {CLEAR_VARIABLE current_tod}
[/event]
#enddef

#define ABILITY_GROWTH
[abilities]
    [dummy]
        id=growth
        name= _ "growth"
        description= _ "This unit gains 1 XP at the end of its side's turn through deep focus."
    [/dummy]
[/abilities]

[event]
    name=side_turn_end
    first_time_only=no

    [lua]
        code = <<
            -- Find all units on the current side that have our specific ability
            local side_num = wesnoth.current.side
            local units = wesnoth.units.find({ 
                ability = "GROWTH", 
                side = side_num 
            })

            for i, u in ipairs(units) do
                -- Add 1 XP
                u.experience = u.experience + 1
                
                -- Visual feedback: a small blue XP float
                wesnoth.interface.float_label(u.x, u.y, "+1 XP", "100,100,255")

                -- Important: Check if 1 XP was enough to level them up!
                if u.experience >= u.max_experience then
                    u:advance(true, true)
                end
            end
        >>
    [/lua]
[/event]
#enddef

# wmllint: unbalanced-on
# wmlxgettext: [abilities]
#define ABILITY_HARPY_PHOENIX
    [dummy]
        id=harpy_phoenix
        name=_ "rise from ashes"
        description=_ "When this unit is killed, they revive with full hitpoints and gain +25% damage for the rest of the scenario. Works once per scenario."
    [/dummy]
    [/abilities]

    [event]
    name=last breath
    first_time_only=no
    id=harpy_phoenix_event
    [filter]
        ability=harpy_phoenix
        [not]
            ability=harpy_phoenix_revived
        [/not]
    [/filter]
    [animate_unit]
        flag=phoenix_anim
        [filter]
            id=$unit.id
        [/filter]
    [/animate_unit]
    [heal_unit]
        [filter]
            id=$unit.id
        [/filter]
        amount=full
        animate=no
        restore_statuses=no
    [/heal_unit]
    [object]
        silent=yes
        duration=scenario
        [filter]
            id=$unit.id
        [/filter]
        [effect]
           apply_to=new_ability
           [abilities]
                [leadership]
                    id=harpy_phoenix_revived
                    add=25
                    name=_"revived"
                    description=_ "This unit has +25% damage on all attacks but cannot revive again. Lasts until the end of this scenario."
                [/leadership]
           [/abilities]
        [/effect]
    [/object]
    [/event]
    [+abilities] # wmlxgettext: [/abilities]
#enddef
# wmllint: unbalanced-off