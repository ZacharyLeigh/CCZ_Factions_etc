#textdomain wesnoth-The_High_Kingdom
[era]
    id=Default_The_High_Kingdom
    name= _ "Default + The High Kingdom"
    require_era=yes
    description= _ "Mainline factions+dunefolk and the High Kingdom."

    ##{RANDOM_SIDE}
    {ERA_DEFAULT}
    {multiplayer/factions/dunefolk-default.cfg}
    {~add-ons/Underlanders/factions/The_High_Kingdom/faction/high_kingdom.cfg}

    {QUICK_4MP_LEADERS}
    {TURNS_OVER_ADVANTAGE}
    [load_resource]
        id=hk_ability_events
    [/load_resource]
    [load_resource]
        id=hk_trait_events
    [/load_resource]
[/era]

