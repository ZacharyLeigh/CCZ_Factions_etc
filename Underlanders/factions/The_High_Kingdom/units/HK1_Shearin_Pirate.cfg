#textdomain wesnoth-The_High_Kingdom
[unit_type]
    id=Shearin Pirate
    name= _ "Shearin Pirate"
    race=hk_pirate
    image="unit_assests/pirate/pirate64.png"
    #image_icon="pirate/pirate64.png~CROP(0,8,72,72)"
    profile="unit_assests/pirate/pirate64.png"
    hitpoints=37
    movement_type=hk1_foot
    movement=6
    experience=10
    gender=male
    level=1
    alignment=chaotic
    advances_to=Shearin Buccaneer
    cost=13
    usage=fighter
    description= _ ""
    num_traits=3
    ignore_race_traits=yes
    # {TRAIT_DEXTROUS}
    {TRAIT_QUICK}
    {TRAIT_STRONG}
    # {TRAIT_RESILIENT}
    {TRAIT_TREACHEROUS}

    [abilities]
        {ABILITY_ROBBERY}
    [/abilities]

    [defense]
        fungus=60
    [/defense]
    [resistance]
        impact=100
        cold=100
    [/resistance]

    [event]
        name=side turn
        first_time_only=no
        [if]
            [variable]
                name=side_gold
                less_than_equal_to=0
            [/variable]
            [then]
                [message]
                    speaker=unit
                    message="I ain't getting paid enough for this! Maybe somebody else will pay my fee!"
                [/message]
                [set_variable]
                    name=unit.side
                    add=1
                [/set_variable]
                [if]
                    [variable]
                        name=unit.side
                        greater_than=$wenoth.sides.length
                    [/variable]
                    [then]
                        [set_variable]
                            name=unit.side
                            value=1
                        [/set_variable]
                    [/then]
                [/if]
            [/then]
        [/if]
    [/event]

    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
    [death]
        start_time=0
        [frame]
            image="unit_assests/pirate/pirate-death[1~6].png:100,50*5,unit_assests/pirate/pirate-death7.png:200"
        [/frame]
    [/death]
    {DEFENSE_ANIM "unit_assests/pirate/pirate-hit[1~3].png:75" "unit_assests/pirate/pirate-64.png" {SOUND_LIST:HUMAN_FEMALE_HIT} }

    [standing_anim]
        start_time=0
        [frame]
            image="unit_assests/pirate/pirate-stand[1~6].png:100"
        [/frame]
    [/standing_anim]
    [movement_anim]
        start_time=0
        [frame]
            image="unit_assests/pirate/pirate-fly[1~6].png:100"
        [/frame]
    [/movement_anim]
    [idle_anim]
        {STANDARD_IDLE_FILTER}
        start_time=0
        [frame]
            image="unit_assests/pirate/pirate-idling[1~9].png:100,unit_assests/pirate/pirate-fly[4~6].png:100"
        [/frame]
    [/idle_anim]

    [attack]
        name=scimitar
        description=_"scimitar"
        type=blade
        range=melee
        damage=6
        number=3
        icon=attacks/scimitar.png
    [/attack]

    [attack_anim]
        [filter_attack]
            name=scimitar
        [/filter_attack]
        offset=0.0~0.2,0.2~0.7,0.7~0.2,0.2~0.0
        start_time=-160
        [frame]
            image="unit_assests/pirate/pirate[1~4].png:100"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -25}
    [/attack_anim]
[/unit_type]
