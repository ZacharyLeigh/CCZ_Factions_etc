#textdomain wesnoth-The_High_Kingdom
[unit_type]
    id=Ekosian Charioteer
    name= _ "Ekosian Charioteer"
    race=high_kingdom
    image="unit_assests/chariot/Charioteer64.png"
    #image_icon="chariot/Charioteer64.png~CROP(0,8,72,72)"
    profile="unit_assests/chariot/Charioteer64.png"
    hitpoints=80
    movement_type=hk_chariot
    movement=12
    experience=360
    gender=female,male
    level=3
    alignment=lawful
    advances_to=Chariot Master
    cost=55
    usage=archer, scout

    description= _ "Underlands can already cause harm with their sharp talons. However, those tasked to fight the colony's foes often reinforce their claws with small blades. Their light gambeson allows them to resist hits slightly better while retaining their kind's mobility. "

    [resistance]
        impact=120
        pierce=110

    [/resistance]
    [defense]
        deep_water=20
        swamp=20
        snow=30
        forest=30
    [/defense]
    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
    [death]
        start_time=0
        [frame]
            image="unit_assests/chariot/Charioteer-death[1~6].png:100,50*5,unit_assests/chariot/Charioteer-death7.png:200"
        [/frame]
    [/death]
    {DEFENSE_ANIM "unit_assests/chariot/Charioteer-hit[1~3].png:75" "unit_assests/chariot/Charioteer-64.png" {SOUND_LIST:HUMAN_FEMALE_HIT} }

    [standing_anim]
        start_time=0
        [frame]
            image="unit_assests/chariot/Charioteer-stand[1~6].png:100"
        [/frame]
    [/standing_anim]
    [movement_anim]
        start_time=0
        [frame]
            image="unit_assests/chariot/Charioteer-fly[1~6].png:100"
        [/frame]
    [/movement_anim]
    [idle_anim]
        {STANDARD_IDLE_FILTER}
        start_time=0
        [frame]
            image="unit_assests/chariot/Charioteer-idling[1~9].png:100,unit_assests/chariot/Charioteer-fly[4~6].png:100"
        [/frame]
    [/idle_anim]

    [attack]
        name=Khopesh
        description=_"Khopesh"
        type=blade
        range=melee
        damage=7
        number=3
        icon=attacks/sword-human.png
    [/attack]

    [attack_anim]
        [filter_attack]
            name=Khopesh
        [/filter_attack]
        offset=0.0~0.2,0.2~0.7,0.7~0.2,0.2~0.0
        start_time=-160
        [frame]
            image="unit_assests/chariot/Anuvian_Charioteer[1~4].png:100"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -25}
    [/attack_anim]

    [attack]
        name=Javalin
        description=_"Javalin"
        type=blade
        range=melee
        damage=15
        number=1
        icon=attacks/spear-thrown.png
    [/attack]

    [attack_anim]
        [filter_attack]
            name=Javalin
        [/filter_attack]
        offset=0.0~0.2,0.2~0.7,0.7~0.2,0.2~0.0
        start_time=-160
        [frame]
            image="unit_assests/chariot/Anuvian_Charioteer[1~4].png:100"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -25}
    [/attack_anim]

    [attack]
        name=Composite Bow
        description=_"Composite Bow"
        type=blade
        range=Ranged
        damage=9
        number=2
        [specials]
            {WEAPON_SPECIAL_DRIVEBY}
        [/specials]
        icon=attacks/bow.png
    [/attack]

    [attack_anim]
        [filter_attack]
            name=Composite Bow
        [/filter_attack]
        offset=0.0~0.2,0.2~0.7,0.7~0.2,0.2~0.0
        start_time=-160
        [frame]
            image="unit_assests/chariot/Anuvian_Charioteer[1~4].png:100"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -25}
    [/attack_anim]
[/unit_type]
