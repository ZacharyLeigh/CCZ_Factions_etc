#textdomain wesnoth-The_High_Kingdom
[unit_type]
    id=Scarab Rider
    name= _ "Scarab Rider"
    race=high_kingdom
    image="unit_assests/beetle/scarab_rider64.png"
    profile="unit_assests/beetle/scarab_rider64.png"
    hitpoints=60
    movement_type=hk_beetle
    movement=5
    experience=120
    gender=male
    level=2
    alignment=lawful
    advances_to=Crawling Fortress
    cost=40
    usage=mixed fighter

    description= _ "As they better their magical craft, some minstrels take delight in catching other's eyes. Switching focus from songs to dance, their plumage changes to reflect their spell-weaving. Paraders, on the opposite of captivators, mean to be noticed, and distract their foes to give their allies more opportunities. "

    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
    [death]
        start_time=0
        [frame]
            image="unit_assests/beetle/scarab_rider64-death[1~7].png:100,50*6,unit_assests/beetle/scarab_rider64-death8.png:200"
        [/frame]
    [/death]
    {DEFENSE_ANIM "unit_assests/beetle/scarab_rider64-hit[1~3,1].png:[75*3,1]" "unit_assests/beetle/scarab_rider64.png" {SOUND_LIST:HUMAN_FEMALE_HIT} }
    [standing_anim]
        [frame]
            image="unit_assests/beetle/scarab_rider64.png"
        [/frame]
    [/standing_anim]
    [standing_anim]
        start_time=0

        submerge=0.01
        [frame]
            image="unit_assests/beetle/scarab_rider64-stand[1~6].png:100"
        [/frame]
    [/standing_anim]
    [movement_anim]
        start_time=0
        [frame]
            image="unit_assests/beetle/scarab_rider64-fly[1~6].png:100"
        [/frame]
    [/movement_anim]
    
    [idle_anim]
        {STANDARD_IDLE_FILTER}
        start_time=0

        [frame]
            image="unit_assests/beetle/scarab_rider64-ensnare[1~4].png:[75*3,50], unit_assests/beetle/scarab_rider64-idling[1~15].png:75"
        [/frame]
    [/idle_anim]

    [attack]
        name=spear
        description=_"Spear"
        type=pierce
        range=melee
        damage=12
        number=2
        icon=attacks/scarab-horn.png
    [/attack]
    [attack]
        name=sling
        description=_"sling"
        type=impact
        range=ranged
        damage=6
        number=3
        icon=attacks/sling.png
    [/attack]

    [attack_anim]
        [filter_attack]
            name=spear
        [/filter_attack]
        direction=s
        offset=0.0:350,0.0~0.7:200,0.7:250,0.7~0.0:200,0.0:75
        directional_x=0:350,0~-20:200,-20:250,-20~0:200,0:75
        start_time=-500
        [frame]
            image="unit_assests/beetle/scarab_rider64-dagger[1~12].png:[100*2,150,100,50*2,100*2,50,100*2,75]"
        [/frame]
        {SOUND:HIT_AND_MISS dagger-swish.wav {SOUND_LIST:MISS} -50}
    [/attack_anim]

    [attack_anim]
        [filter_attack]
            name=sling
        [/filter_attack]
        missile_start_time=-100
        [missile_frame]
            offset=1.0
            duration=350
            image=halo/elven/shaman-heal-halo-[1~7].png:50~BLEND(0,76,0,100%)
            auto_vflip=no
        [/missile_frame]
        start_time=-800
        [frame]
            image="unit_assests/beetle/scarab_rider64-ensnare[1~18].png:[75*3,50*2,75*10,50,75*2]"
        [/frame]
        {SOUND:HIT_AND_MISS magic-faeriefire.ogg magic-faeriefire-miss.ogg -75}
        halo_start_time=-400
        [frame]
            image="unit_assests/beetle/scarab_rider64.png:1"
        [/frame]
    [/attack_anim]
[/unit_type]
