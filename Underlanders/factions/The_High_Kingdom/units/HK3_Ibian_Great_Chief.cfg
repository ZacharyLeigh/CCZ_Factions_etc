#textdomain wesnoth-The_High_Kingdom
[unit_type]
    id=Ibian Great Chief
    name= _ "Ibian Great Chief"
    race=high_kingdom
    image="unit_assests/Ibian_Great_Chief/Ibian_Great_Chief.png"
    image_icon="unit_assests/Ibian_Great_Chief/Ibian_Great_Chief.png"
    profile="unit_assests/Ibian_Great_Chief/Ibian_Great_Chief-portrait-female.webp"
    small_profile="unit_assests/Ibian_Great_Chief/Ibian_Great_Chief-portrait-female.webp~CROP(0,0,686,580)"
    hitpoints=62
    movement_type=Ibian
    movement=7
    experience=10
    gender=female,male
    level=3
    alignment=lawful
    advances_to=null
    {AMLA_FEATHERLORD}
    cost=65
    usage=mixed fighter

    description= _ "Harpy commanders use their bird companion and specific calls to quickly transmit orders on the battlefield. Their brightly colored flag helps them catch their allies' attention to redirect troops wherever necessary. "

    [abilities]
        {ABILITY_LEADERSHIP}
        {ABILITY_SKIRMISHER}
    [/abilities]
    [defense]
        hills=40
        mountains=30
    [/defense]
    [resistance]
        blade=90
        pierce=90
        impact=110
    [/resistance]

    [leading_anim]
        start_time=-200
        [frame]
            image="unit_assests/Ibian_Great_Chief/Ibian_Great_Chief-lead[1~4].png:75,unit_assests/Ibian_Great_Chief/Ibian_Great_Chief.png:50"
        [/frame]
        halo_start_time=-100
        [halo_frame]
            halo="halo/misc/leadership-flare-[1~13].png:20"
            halo_x,halo_y=42,-42
        [/halo_frame]
    [/leading_anim]

    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
    [death]
        start_time=0
        [frame]
            image="unit_assests/Ibian_Great_Chief/Ibian_Great_Chief-death[1~10].png:[100,50*9]"
        [/frame]
    [/death]

    {DEFENSE_ANIM "unit_assests/Ibian_Great_Chief/Ibian_Great_Chief-hit[1~3].png:75" "unit_assests/Ibian_Great_Chief/Ibian_Great_Chief.png" {SOUND_LIST:HUMAN_FEMALE_HIT} }

    [standing_anim]
        [frame]
            image="unit_assests/Ibian_Great_Chief/Ibian_Great_Chief-idle[1~4].png:200"
        [/frame]
    [/standing_anim]
    [standing_anim]
        start_time=0

        submerge=0.01
        [frame]
            image="unit_assests/Ibian_Great_Chief/Ibian_Great_Chief-stand[1~4].png:150"
        [/frame]
    [/standing_anim]
    [movement_anim]
        start_time=0
        [frame]
            image="unit_assests/Ibian_Great_Chief/Ibian_Great_Chief-fly[1~4].png:150"
        [/frame]
    [/movement_anim]
    
    [attack]
        name=spear
        description=_"spear"
        type=pierce
        range=melee
        damage=5
        number=4
        icon=attacks/spear-orcish.png
    [/attack]

    [attack_anim]
        [filter_attack]
            name=spear
        [/filter_attack]
        offset=0.0~0.2,0.2~0.7,0.7~0.2,0.2~0.0
        start_time=-160
        [frame]
            image="unit_assests/Ibian_Mercenary/Ibian_Mercenary-attack[1~4].png:100"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -25}
    [/attack_anim]

    [attack]
        name=sling
        description=_"sling"
        type=impact
        range=ranged
        damage=3
        number=3
        icon=attacks/sling.png
    [/attack]

    [attack_anim]
        [filter_attack]
            name=sling
        [/filter_attack]
        offset=0.0~0.2,0.2~0.7,0.7~0.2,0.2~0.0
        start_time=-160
        [frame]
            image="unit_assests/Ibian_Mercenary/Ibian_Mercenary[1~4].png:100"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -25}
    [/attack_anim]
[/unit_type]
