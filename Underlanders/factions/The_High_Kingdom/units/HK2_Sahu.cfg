#textdomain wesnoth-The_High_Kingdom
[unit_type]
    id=Sahu
    name= _ "Sahu"
    race=high_kingdom
    image="unit_assests/khat/Sahu64.png"
    image_icon="unit_assests/khat/Sahu64.png~CROP(0,8,72,72)"
    profile="unit_assests/khat/Sahu64.png"
    hitpoints=34
    movement_type=hk_sahu
    movement=6
    experience=10
    gender=female,male
    level=2
    alignment=liminal
    advances_to=Akh
    cost=22
    usage=fighter

    description= _ "Underlands can already cause harm with their sharp talons. However, those tasked to fight the colony's foes often reinforce their claws with small blades. Their light gambeson allows them to resist hits slightly better while retaining their kind's mobility. "

    [resistance]
        impact=70
    [/resistance]
    [defense]
        deep_water=60
    [/defense]
    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
    [death]
        start_time=0
        [frame]
            image="unit_assests/Sahu/Sahu-death[1~6].png:100,50*5,unit_assests/Sahu/Sahu-death7.png:200"
        [/frame]
    [/death]
    {DEFENSE_ANIM "unit_assests/Sahu/Sahu-hit[1~3].png:75" "unit_assests/Sahu/Sahu-64.png" {SOUND_LIST:HUMAN_FEMALE_HIT} }

    [standing_anim]
        start_time=0
        [frame]
            image="unit_assests/Sahu/Sahu-stand[1~6].png:100"
        [/frame]
    [/standing_anim]
    [movement_anim]
        start_time=0
        [frame]
            image="unit_assests/Sahu/Sahu-fly[1~6].png:100"
        [/frame]
    [/movement_anim]
    [idle_anim]
        {STANDARD_IDLE_FILTER}
        start_time=0
        [frame]
            image="unit_assests/Sahu/Sahu-idling[1~9].png:100,unit_assests/Sahu/Sahu-fly[4~6].png:100"
        [/frame]
    [/idle_anim]

    [attack]
        name=claws
        description=_"talons"
        type=blade
        range=melee
        damage=7
        number=3
        icon=attacks/claws-animal.png
    [/attack]

    [attack_anim]
        [filter_attack]
            name=claws
        [/filter_attack]
        offset=0.0~0.2,0.2~0.7,0.7~0.2,0.2~0.0
        start_time=-160
        [frame]
            image="unit_assests/Sahu/Sahu[1~4].png:100"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -25}
    [/attack_anim]
[/unit_type]
