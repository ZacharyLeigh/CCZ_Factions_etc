#textdomain wesnoth-The_High_Kingdom
[unit_type]
    id=Anuvian Chariot Master
    name= _ "Anuvian Chariot Master"
    race=high_kingdom
    image="unit_assests/chariot/chariot_master64.png"
    image_icon="unit_assests/chariot/chariot_master64.png~CROP(0,8,72,72)"
    profile="unit_assests/chariot/chariot_master64.png"
    hitpoints=100
    movement_type=hk_chariot
    movement=14
    experience=120
    gender=male
    level=4
    alignment=lawful
    advances_to=null
    {AMLA_ENDSINGER}
    cost=77
    usage=fighter

    description= _ "Underlands can already cause harm with their sharp talons. However, those tasked to fight the colony's foes often reinforce their claws with small blades. Their light gambeson allows them to resist hits slightly better while retaining their kind's mobility. "

    [resistance]
        impact=100
    [/resistance]
    [defense]
        deep_water=50
    [/defense]
    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
    [death]
        start_time=0
        [frame]
            image="unit_assests/Anuvian_Chariot_Master/Anuvian_Chariot_Master-death[1~6].png:100,50*5,unit_assests/Anuvian_Chariot_Master/Anuvian_Chariot_Master-death7.png:200"
        [/frame]
    [/death]
    {DEFENSE_ANIM "unit_assests/Anuvian_Chariot_Master/Anuvian_Chariot_Master-hit[1~3].png:75" "unit_assests/Anuvian_Chariot_Master/Anuvian_Chariot_Master-64.png" {SOUND_LIST:HUMAN_FEMALE_HIT} }

    [standing_anim]
        start_time=0
        [frame]
            image="unit_assests/Anuvian_Chariot_Master/Anuvian_Chariot_Master-stand[1~6].png:100"
        [/frame]
    [/standing_anim]
    [movement_anim]
        start_time=0
        [frame]
            image="unit_assests/Anuvian_Chariot_Master/Anuvian_Chariot_Master-fly[1~6].png:100"
        [/frame]
    [/movement_anim]
    [idle_anim]
        {STANDARD_IDLE_FILTER}
        start_time=0
        [frame]
            image="unit_assests/Anuvian_Chariot_Master/Anuvian_Chariot_Master-idling[1~9].png:100,unit_assests/Anuvian_Chariot_Master/Anuvian_Chariot_Master-fly[4~6].png:100"
        [/frame]
    [/idle_anim]

    [attack]
        name=Khopesh
        description=_"Khopesh"
        type=blade
        range=melee
        damage=7
        number=3
        icon=attacks/sword-human.png
    [/attack]

    [attack_anim]
        [filter_attack]
            name=Khopesh
        [/filter_attack]
        offset=0.0~0.2,0.2~0.7,0.7~0.2,0.2~0.0
        start_time=-160
        [frame]
            image="unit_assests/chariot/Anuvian_Charioteer[1~4].png:100"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -25}
    [/attack_anim]

    [attack]
        name=Javalin
        description=_"Javalin"
        type=blade
        range=melee
        damage=15
        number=1
        icon=attacks/spear-thrown.png
    [/attack]

    [attack_anim]
        [filter_attack]
            name=Javalin
        [/filter_attack]
        offset=0.0~0.2,0.2~0.7,0.7~0.2,0.2~0.0
        start_time=-160
        [frame]
            image="unit_assests/chariot/Anuvian_Charioteer[1~4].png:100"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -25}
    [/attack_anim]

    [attack]
        name=Composite Bow
        description=_"Composite Bow"
        type=blade
        range=Ranged
        damage=9
        number=2
        [specials]
            {WEAPON_SPECIAL_QUICKSTRIKE}
        [/specials]
        icon=attacks/bow.png
    [/attack]

    [attack_anim]
        [filter_attack]
            name=Composite Bow
        [/filter_attack]
        offset=0.0~0.2,0.2~0.7,0.7~0.2,0.2~0.0
        start_time=-160
        [frame]
            image="unit_assests/chariot/Anuvian_Charioteer[1~4].png:100"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -25}
    [/attack_anim]

[/unit_type]
