#textdomain wesnoth-The_High_Kingdom
[unit_type]
    id=Emissary of Osiris
    name= _ "Emissary of Osiris"
    race=high_kingdom
    image="unit_assests/initiate/Emissary_of_Osiris64.png"
    profile="unit_assests/initiate/Emissary_of_Osiris64.png"
    hitpoints=99
    movement_type=hk_deity
    movement=6
    experience=10
    gender=male,female
    level=4
    alignment=chaotic
    advances_to=null
    {AMLA_ENDSINGER}
    cost=120
    usage=healer

    description= _ "Long ago there was a forest-bound kingdom of many different kin, with its lord and lady known as fierce defenders of the land. But through war it was sullied, and although its invaders withdrew, many lives were lost. Now the forests are void and dark, and at night, one must be careful not to encounter vengeful specters from the past."

    die_sound={SOUND_LIST:HUMAN_DIE}
    [abilities]
        {ABILITY_EMBALMER}  #Non-mummy ally units become mummies if they die
        {ABILITY_DARKENS}
        # {ABILITY_DEFENDER} #Surronding allies take %13 less damage
    [/abilities]
    [resistance]
        arcane=120
    [/resistance]
    [defense]
        cave=70
        fungus=60
    [/defense]
    [movement_costs]
        cave=1
        fungus=1
    [/movement_costs]
    [death]
        start_time=0
        [frame]
            image="unit_assests/initiate/Emissary_of_Osiris-death[1~12].png:[100*3,500,50,100*2,300,50,100*2,400]"
        [/frame]
    [/death]
    {DEFENSE_ANIM "unit_assests/initiate/Emissary_of_Osiris-hit[1~3,1].png:[75*3,1]" "unit_assests/initiate/Emissary_of_Osiris64.png" {SOUND_LIST:HUMAN_HIT} }

    [standing_anim]
        [frame]
            image="unit_assests/initiate/Emissary_of_Osiris64.png"
        [/frame]
    [/standing_anim]
    [standing_anim]
        start_time=0

        submerge=0.01
        [frame]
            image="unit_assests/initiate/Emissary_of_Osiris-stand[1~4].png:200"
        [/frame]
    [/standing_anim]
    [movement_anim]
        start_time=0
        [frame]
            image="unit_assests/initiate/Emissary_of_Osiris-fly[1~4].png:200"
        [/frame]
    [/movement_anim]
    
    
    
    
    [idle_anim]
        {STANDARD_IDLE_FILTER}

        start_time=0
        [frame]
            image="unit_assests/initiate/Emissary_of_Osiris-idle[2~6].png:[200*2,800,200*2]"
        [/frame]
    [/idle_anim]

    [attack]
        name=knife
        description=_"knife"
        type=blade
        range=melee
        damage=25
        number=3
        icon=attacks/dagger-human.png
        [specials]
            {WEAPON_SPECIAL_MAGICAL}
            #{WEAPON_SPECIAL_JUSTIFIED} Does bonus damage against chaotic foes, and less against Lawful
        [/specials]
    [/attack]

    [attack]
        name=Judgement
        description=_"Light of Judgement"
        icon=attacks/lightbeam.png
        type=arcane
        range=ranged
        [specials]
            {WEAPON_SPECIAL_MAGICAL}
            #{WEAPON_SPECIAL_JUSTIFIED} Does bonus damage against chaotic foes, and less against Lawful
        [/specials]
        damage=33
        number=3
    [/attack]

    [attack_anim]
        [filter_attack]
            name=dagger
        [/filter_attack]
        direction=sw,se
        offset=0.0~0.2:80,0.2~0.5:80,0.5:160,0.5~0.2:80,0.2~0.0:80
        start_time=-160
        [frame]
            image="unit_assests/Priest_of_Anubis/Priest_of_Anubis-enchantress-dagger[1~6].png:80"
        [/frame]
        {SOUND:HIT_AND_MISS dagger-swish.wav {SOUND_LIST:MISS} -100}
    [/attack_anim]

    [attack_anim]
        [filter_attack]
            name=Judgement
        [/filter_attack]
        missile_start_time=-200
        [missile_frame]
            offset=1.0
            image="unit_assests/Priest_of_Anubis/Priest_of_Anubis-wail2-front[1~6].png:75,unit_assests/Priest_of_Anubis/Priest_of_Anubis-wail2-front[7~10].png:50"
            auto_vflip=no
        [/missile_frame]
        missile2_start_time=-200
        [missile2_frame]
            offset=1.0
            image="unit_assests/Priest_of_Anubis/Priest_of_Anubis-wail2-back[1~6].png:75,unit_assests/Priest_of_Anubis/Priest_of_Anubis-wail2-back[7~10].png:50"
            layer=20
            auto_vflip=no
        [/missile2_frame]
        start_time=-200
        [frame]
            image="unit_assests/Priest_of_Anubis/Priest_of_Anubis-enchantress-sing[1~8].png:100"
            blend_color=176,212,255
            blend_ratio=0.2
        [/frame]
        halo_start_time=-150
        [halo_frame]
            halo=halo/saurian-magic-halo-[1~7].png:60
            halo_x,halo_y=0,-12
            auto_vflip=no
        [/halo_frame]
        attack_sound_start_time=-75
        [attack_sound_frame]
            sound=wail-sml.wav
        [/attack_sound_frame]
        [frame]
            image="unit_assests/Priest_of_Anubis/Priest_of_Anubis-enchantress.png:50"
            blend_color=176,212,255
            blend_ratio=0.2
        [/frame]
    [/attack_anim]
[/unit_type]
