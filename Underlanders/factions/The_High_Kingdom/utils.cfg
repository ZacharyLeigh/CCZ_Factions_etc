#textdomain wesnoth-The_High_Kingdom

#define ABILITY_HEAL_4
    [heals]
        value=4
        id=healing
        affect_allies=yes
        name= _ "heals +4"
        female_name= _ "female^heals +4"
        description= _ "This unit uses ancient magic to heal units more quickly than is normally possible on the battlefield.

A unit cared for by this healer may heal up to 4 HP per turn, or be cured of poison."
        affect_self=no
        poison=cured
        [affect_adjacent]
        [/affect_adjacent]
    [/heals]
#enddef

#define ABILITY_EMBALMER
    [dummy]
        id=embalm
        name= _ "embalm"
        description= _ "When an allied unit dies next to an Embalmer, that unit is replaced with a Khat. This doesn’t work on Undead."
    [/dummy]
#enddef

#define ABILITY_EMBALMERS_PROTECTION
    [dummy]
        id=embalmers_protection
        name=_"Embalmer's Protection"
        description= _"If this unit dies, it is turned into a Khat"
    [/dummy]
#enddef

#define ABILITY_EMBALMER_EVENT
    [event]
        name=last breath
        first_time_only=no
        [filter]
            [not]
                race=undead
            [/not]
            [not]
                race=elemental
            [/not]
            [not]
                is_enemy=yes
            [/not]
            [filter_adjacent]
                [not]
                    is_enemy=yes
                [/not]
                ability=embalm
            [/filter_adjacent]
        [/filter]
        # I think the filter is better set up than before,
        # still need to implement a better version of plague, do instant dvancement instead
#        [plague]
#            id=plague(khat)
#            affect_self=yes
#            type=khat
#        [/plague]
        {ADVANCE_UNIT x,y=$x1,$y1 "khat"}
        {UPDATE_STATS}
    [/event]
#enddef

#define ABILITY_DARKENS
	[illuminates]
		id=darkens
		value=-25
		min_value=-25
		max_value=25
		cumulative=no
		affect_self=yes
		halo_image="halo/darkens-aura.png"
		name= _ "darkens"
		female_name= _ "female^darkens"
		description= _ "This unit darkens the surrounding area, making chaotic units fight better, and lawful units fight worse.

Any units adjacent to this unit will fight as if it were dusk when it is day, and as if it were night when it is dusk."
	[/illuminates]
#enddef


