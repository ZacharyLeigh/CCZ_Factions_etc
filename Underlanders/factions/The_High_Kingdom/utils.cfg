#define ABILITY_CRAB_LEADERSHIP
[leadership]
    id=crab_leadership
    name=_'leadership (crab)'
    description=_"This unit inpires it's crab subjects to fight harder."
    first_time_only=no
    affect_allies=yes
    affect_self=no
    [affect_adjacent]
        [filter]
            race=crab
            formula="level < other.level"
        [/filter]
	[/affect_adjacent]
    value="(30 * (level - other.level))"
    cumulative=no
[/leadership]
#enddef

