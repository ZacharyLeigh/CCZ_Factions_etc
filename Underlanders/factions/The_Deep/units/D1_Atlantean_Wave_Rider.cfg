#textdomain wesnoth-The_Deep
[unit_type]
    id=Atlantean Wave Rider
    name= _ "Atlantean Wave Rider"
    race=deep
    image="wave_rider/wave_rider-idle.png"
    image_icon="wave_rider/wave_rider-idle.png"
    profile="wave_rider/wave_rider-idle.png"
    hitpoints=39
    movement_type=Deep_foot
    movement=5
        # perhaps we give him 12 movement, but every tile costs 2 mp to get through, and flat would cost 3, with unfavorable costing 4 or 5.
    experience=35
    gender=female,male
    level=1
    alignment=neutral
    advances_to=Atlantean Tide Knight
    cost=23
    usage=fighter

    description= _ "Deep can already cause harm with their sharp talons. However, those tasked to fight the colony's foes often reinforce their claws with small blades. Their light gambeson allows them to resist hits slightly better while retaining their kind's mobility. "

    [resistance]
        blade=110
    [/resistance]
    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
    [death]
        start_time=0
        [frame]
            image="wave_rider/wave_rider-die.png"
        [/frame]
    [/death]

    [standing_anim]
        start_time=0
        [frame]
            image="wave_rider/wave_rider-idle.png"
        [/frame]
    [/standing_anim]
    [movement_anim]
        start_time=0
        [frame]
            image="wave_rider/wave_rider-run.png"
        [/frame]
    [/movement_anim]

    [attack]
        name=spear
        description=_"spear"
        type=pierce
        range=melee
        damage=8
        [specials]
            {WEAPON_SPECIAL_CHARGE}
        [/specials]
        number=2
        icon=attacks/spear.png
    [/attack]
    [attack_anim]
        [filter_attack]
            name=spear
        [/filter_attack]
        offset=0.0~0.2,0.2~0.7,0.7~0.2,0.2~0.0
        start_time=-160
        [frame]
            image="wave_rider/wave_rider-attack1.png"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -25}
    [/attack_anim]

    [attack]
        name=spear blast
        description=_"spear blast"
        type=arcane
        range=ranged
        damage=5
        number=2
        icon=attacks/fire-blast.png
    [/attack]
    [attack_anim]
        [filter_attack]
            name=spear blast
        [/filter_attack]
        offset=0.0~0.2,0.2~0.7,0.7~0.2,0.2~0.0
        start_time=-160
        [frame]
            image="wave_rider/wave_rider-attack1.png"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -25}
    [/attack_anim]

[/unit_type]

