#textdomain wesnoth-The_Deep
[unit_type]
    id=Atlantean Senator
    name= _ "Atlantean Senator"
    race=Deep
    image="raptortongue/deep-raptortongue-healthy.png"
    image_icon="raptortongue/deep-raptortongue-healthy.png"
    profile="raptortongue/deep-raptortongue-portrait-female2.webp"
    small_profile="raptortongue/deep-raptortongue-portrait-female2.webp~CROP(0,0,415,623)"
    hitpoints=50
    movement_type=Deep_foot
    movement=7
    experience=90
    gender=female,male
    level=3
    alignment=chaotic
    advances_to=null
    cost=30
    usage=fighter mixed

    [abilities]
        {ABILITY_CONCEALMENT}
        #{ABILITY_PROTECTOR}
    [/abilities]


    description= _ "Over time falconeers efficiently learn the falcons' language. As the bird ages their tamer often will bring in new recruits for taming. "

    #all anims are filtered based on the unit's health level, to reflect the falcon flock whittling down with swarm. So there's 2 variations for each anim (except death)

    [resistance]
        #blade=75
        #pierce=75
        #impact=90
    [/resistance]
    [defense]
        #deep_water=50
        #shallow_water=60
        #swamp=60
    [/defense]

    #This is a reference to ceasar's assassination, but 23 attacks is too abusable, so we go for 23 damage instead
    [attack]
        name=knife
        description=_"knife"
        type=pierce
        range=melee
        damage=23
        number=1
        [specials]
            {WEAPON_SPECIAL_BACKSTAB}
        [/specials]
        icon=attacks/claws-animal.png
    [/attack]

    [attack]
        name=Crystal Curse
        description=_"Crystal Curse"
        type=cold
        range=ranged
        damage=10
        number=4
        [specials]
            {WEAPON_SPECIAL_SLOW}
        [/specials]
        icon=attacks/claws-animal.png
    [/attack]

    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
    [death]
        start_time=0
        [frame]
            image="raptortongue/deep-raptortongue-death[1~9].png:[100,50*8]"
        [/frame]
    [/death]

    {DEFENSE_ANIM_FILTERED "raptortongue/deep-raptortongue-healthy-hit[1~3].png:75" "raptortongue/deep-raptortongue-healthy.png" {SOUND_LIST:HUMAN_FEMALE_HIT}
    (
    [filter]
            formula="if(self.hitpoints >= self.max_hitpoints / 2, 1, 0)"
    [/filter]
    )}
    {DEFENSE_ANIM_FILTERED "raptortongue/deep-raptortongue-wounded-hit[1~3].png:75" "raptortongue/deep-raptortongue-wounded.png" {SOUND_LIST:HUMAN_FEMALE_HIT}
    (
    [filter]
        formula="if(self.hitpoints < self.max_hitpoints / 2, 1, 0)"
    [/filter]
    )}

[movement_anim]
    [filter]
        formula="if(self.hitpoints >= self.max_hitpoints / 2, 1, 0)"
    [/filter]
    start_time=0
    [frame]
        image="raptortongue/deep-raptortongue-healthy-fly[1~4].png:150"
    [/frame]
[/movement_anim]
[movement_anim]
    [filter]
        formula="if(self.hitpoints < self.max_hitpoints / 2, 1, 0)"
    [/filter]
    start_time=0
    [frame]
        image="raptortongue/deep-raptortongue-wounded-fly[1~4].png:150"
    [/frame]
[/movement_anim]

[pre_movement_anim]

    [filter]
        formula="if(self.hitpoints >= self.max_hitpoints / 2, 1, 0)"
    [/filter]
    start_time=0
    [frame]
        image="raptortongue/deep-raptortongue-healthy-takeoff[1~4].png:50"
    [/frame]
[/pre_movement_anim]
[pre_movement_anim]

    [filter]
        formula="if(self.hitpoints < self.max_hitpoints / 2, 1, 0)"
    [/filter]
    start_time=0
    [frame]
        image="raptortongue/deep-raptortongue-wounded-takeoff[1~4].png:50"
    [/frame]
[/pre_movement_anim]

[post_movement_anim]

    [filter]
        formula="if(self.hitpoints >= self.max_hitpoints / 2, 1, 0)"
    [/filter]
    start_time=0
    [frame]
        image="raptortongue/deep-raptortongue-healthy-land[1~2].png:50"
    [/frame]
[/post_movement_anim]
[post_movement_anim]

    [filter]
        formula="if(self.hitpoints < self.max_hitpoints / 2, 1, 0)"
    [/filter]
    start_time=0
    [frame]
        image="raptortongue/deep-raptortongue-wounded-land[1~2].png:50"
    [/frame]
[/post_movement_anim]

[draw_weapon_anim]

    [filter]
        formula="if(self.hitpoints >= self.max_hitpoints / 2, 1, 0)"
    [/filter]
    start_time=0
    [frame]
        image="raptortongue/deep-raptortongue-healthy-land[1~2].png:50"
    [/frame]
[/draw_weapon_anim]
[draw_weapon_anim]

    [filter]
        formula="if(self.hitpoints < self.max_hitpoints / 2, 1, 0)"
    [/filter]
    start_time=0
    [frame]
        image="raptortongue/deep-raptortongue-wounded-land[1~2].png:50"
    [/frame]
[/draw_weapon_anim]

[sheath_weapon_anim]

    [filter]
        formula="if(self.hitpoints >= self.max_hitpoints / 2, 1, 0)"
    [/filter]
    start_time=0
    [frame]
        image="raptortongue/deep-raptortongue-healthy-takeoff[1~4].png:50"
    [/frame]
[/sheath_weapon_anim]
[sheath_weapon_anim]

    [filter]
        formula="if(self.hitpoints < self.max_hitpoints / 2, 1, 0)"
    [/filter]
    start_time=0
    [frame]
        image="raptortongue/deep-raptortongue-wounded-takeoff[1~4].png:50"
    [/frame]
[/sheath_weapon_anim]

[standing_anim]
    [filter]
        formula="if(self.hitpoints >= self.max_hitpoints / 2, 1, 0)"
    [/filter]
    [frame]
        image="raptortongue/deep-raptortongue-healthy.png"
    [/frame]
[/standing_anim]
[standing_anim]
    [filter]
        formula="if(self.hitpoints < self.max_hitpoints / 2, 1, 0)"
    [/filter]
    [frame]
        image="raptortongue/deep-raptortongue-wounded.png"
    [/frame]
[/standing_anim]

[standing_anim]

    submerge=0.01
    [filter]
        formula="if(self.hitpoints >= self.max_hitpoints / 2, 1, 0)"
    [/filter]
    [frame]
        image="raptortongue/deep-raptortongue-healthy-fly[1~4].png:150"
    [/frame]
[/standing_anim]
[standing_anim]

    submerge=0.01
    [filter]
        formula="if(self.hitpoints < self.max_hitpoints / 2, 1, 0)"
    [/filter]
    [frame]
        image="raptortongue/deep-raptortongue-wounded-fly[1~4].png:150"
    [/frame]
[/standing_anim]

[idle_anim]
    {STANDARD_IDLE_FILTER}

    [filter]
        formula="if(self.hitpoints >= self.max_hitpoints / 2, 1, 0)"
    [/filter]
    start_time=0
    [frame]
        image="raptortongue/deep-raptortongue-idling[1~23].png:100"
    [/frame]
[/idle_anim]

[attack_anim]
    [filter_attack]
        name=Bite
    [/filter_attack]
    [filter]
        formula="if(self.hitpoints >= self.max_hitpoints / 2, 1, 0)"
    [/filter]
    offset=0.0~0.2,0.2~0.7,0.7~0.2,0.2~0.0
    start_time=-260
    [frame]
        image="raptortongue/deep-raptortongue-healthy-talon[1~8].png:100"
    [/frame]
    {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -25}
[/attack_anim]

[attack_anim]
    [filter_attack]
        name=Chaos
    [/filter_attack]
    [filter]
        formula="if(self.hitpoints < self.max_hitpoints / 2, 1, 0)"
    [/filter]
    offset=0.0~0.2,0.2~0.7,0.7~0.2,0.2~0.0
    start_time=-260
    [frame]
        image="raptortongue/deep-raptortongue-wounded-talon[1~7].png:100"
    [/frame]
    {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -25}
[/attack_anim]


[/unit_type]
