#textdomain wesnoth-The_Deep
[unit_type]
    id=Atlantean Fire Ranger
    name= _ "Atlantean Fire Ranger"
    race=Deep
    image="bowman/deep-bowman2.png"
    image_icon="bowman/deep-bowman2.png~CROP(0,8,72,72)"
    profile="bowman/deep-bowman2.png"
    hitpoints=45
    movement_type=Deep_foot
    movement=5
    experience=90
    gender=female,male
    level=2
    alignment=neutral
    advances_to=Atlantean Hero
    cost=29
    usage=archer

    description= _ "Deep can already cause harm with their sharp talons. However, those tasked to fight the colony's foes often reinforce their claws with small blades. Their light gambeson allows them to resist hits slightly better while retaining their kind's mobility. "

    [defense]
        deep_water=50
        shallow_water=40
        swamp=60
    [/defense]
    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}

    [attack]
        name=Torch
        description=_"Torch"
        type=fire
        range=melee
        damage=6
        number=3
        icon=attacks/torch.png
    [/attack]

    [attack]
        name=Short Bow
        description=_"Short Bow"
        type=pierce
        range=ranged
        damage=7
        number=4
        [specials]
            {WEAPON_SPECIAL_ARCANE}
        [/specials]
        icon=attacks/bow.png
    [/attack]
[/unit_type]
