#textdomain wesnoth-The_Deep
#based off of rough rinos, 3rd ranged is the walking foretress with a catapult, melee gets polearm stuff

[unit_type]
    id=Diving Beetle
    name= _ "Diving Beetle"
    race=deep
    image="falconeer/harpy-falconeer.png"
    image_icon="falconeer/harpy-falconeer.png"
    profile="falconeer/harpy-falconeer-portrait-female.webp"
    small_profile="falconeer/harpy-falconeer-portrait-female.webp~CROP(0,0,562,703)"
    hitpoints=33
    movement_type=deepfly
    movement=8
    experience=50
    gender=female,male
    level=1
    alignment=neutral
    advances_to=null
    cost=19
    usage=scout

    description= _ "Fast, hard to hit, deadly. When you do hit them though, they crumble like paper."
    
    [abilities]
        {ABILITY_SUBMERGE}
    [/abilities]

    [movement_costs]
        deep_water=1
        sand=1
        fungus=1
        forest=1
        cave=2
        shallow_water=1
        swamp=1
        mountains=2
        hills=1
        frozen=3
        castle=1
        village=1
        reef=1
        flat=1
    [/movement_costs]
        reef=1
        deep_water=1
        shallow_water=1
        swamp_water=1
        flat=2
        sand=2
        forest=3
        hills=3
        mountains=3
        village=1
        castle=1
        cave=2
        frozen=2
        fungus=3
    [defense]
        deep_water=30
        cave=40
        sand=50
        village=50
        forest=50
        hills=50
        swamp=40
        mountains=60
        shallow_water=40
        frozen=90
        fungus=20
        castle=50
        reef=40
    [/defense]
    [resistance]
        blade=80
        pierce=70
        impact=90
        fire=120
        cold=120
        arcane=110
    [/resistance]
    
    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}

    [attack]
        name=Pincers
        description=_"Pincers"
        type=blade
        range=melee
        damage=9
        number=2
        icon=attacks/fangs-bug.png
    [/attack]

    [attack_anim]
        [filter_attack]
            name=Pincers
        [/filter_attack]
        offset=0.0~0.2,0.2~0.7,0.7~0.2,0.2~0.0
        start_time=-260
        [frame]
            image="falconeer/harpy-falconeer-talonb[1~7].png:100"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -25}
    [/attack_anim]
[/unit_type]
