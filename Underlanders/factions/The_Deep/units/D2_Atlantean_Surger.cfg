#textdomain wesnoth-The_Deep
[unit_type]
    id=Atlantean Surger
    name= _ "Atlantean Surger"
    race=Deep1
    image="manta_scout/surger64"
    image_icon="manta_scout/surger64~CROP(0,8,72,72)"
    profile="manta_scout/surger64"
    hitpoints=45
    movement_type=Deep_foot #flying
    movement=7
    experience=85
    gender=female,male
    level=2
    alignment=neutral
    advances_to=Storm Bringer
    cost=33
    usage=scout

    description= _ "Deep can already cause harm with their sharp talons. However, those tasked to fight the colony's foes often reinforce their claws with small blades. Their light gambeson allows them to resist hits slightly better while retaining their kind's mobility. "

    [abilities]
        #{ABILITY_STORMSURGE}
    [/abilities]
    [resistance]
        impact=120
        arcane=90
    [/resistance]
    [defense]
        forest=50
        flat=50
        sand=50
        hills=50
        Mountain=40
        frozen=50
        shallow_water=60
        deep_water=70
    [/defense]

    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
    [death]
        start_time=0
        [frame]
            image="manta_scout/surger64-death[1~6].png:100,50*5,manta_scout/surger64-death7.png:200"
        [/frame]
    [/death]
    {DEFENSE_ANIM "manta_scout/surger64-hit[1~3].png:75" "manta_scout/surger642.png" {SOUND_LIST:HUMAN_FEMALE_HIT} }

    [standing_anim]
        start_time=0
        [frame]
            image="manta_scout/surger64-fly[1~6].png:100"
        [/frame]
    [/standing_anim]
    [movement_anim]
        start_time=0
        [frame]
            image="manta_scout/surger64-fly[1~6].png:100"
        [/frame]
    [/movement_anim]
    [idle_anim]
        {STANDARD_IDLE_FILTER}
        start_time=0
        [frame]
            image="manta_scout/surger64-idling[1~9].png:100,manta_scout/surger64-fly[4~6].png:100"
        [/frame]
    [/idle_anim]

    [attack]
        name=Trident
        description=_"Trident"
        type=pierce
        range=melee
        damage=10
        number=2
        icon=attacks/trident.png
    [/attack]
    [attack_anim]
        [filter_attack]
            name=Trident
        [/filter_attack]
        offset=0.0~0.2,0.2~0.7,0.7~0.2,0.2~0.0
        start_time=-160
        [frame]
            image="manta_scout/surger64-trident[1~4].png:100"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -25}
    [/attack_anim]

    [attack]
        name=Lightning
        description=_"Lightning"
        type=arcane #Lightning
        range=ranged
        damage=8
        number=3
        [specials]
            {WEAPON_SPECIAL_MAGICAL}
        [/specials]
        icon=attacks/lightning.png
    [/attack]
    [attack_anim]
        [filter_attack]
            name=Lightning
        [/filter_attack]
        offset=0.0~0.2,0.2~0.7,0.7~0.2,0.2~0.0
        start_time=-160
        [frame]
            image="manta_scout/surger64-trident[1~4].png:100"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -25}
    [/attack_anim]

[/unit_type]

