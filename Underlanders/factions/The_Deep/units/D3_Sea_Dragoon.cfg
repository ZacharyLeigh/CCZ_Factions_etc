#textdomain wesnoth-The_Deep
[unit_type]
    id=Atlantean Sea Dragoon
    name= _ "Atlantean Sea Dragoon"
    race=Deep
    image="fighter/deep-fighter2.png"
    image_icon="fighter/deep-fighter2.png~CROP(0,8,72,72)"
    profile="fighter/deep-fighter2.png"
    hitpoints=80
    movement_type=Deep_foot
    movement=10
    experience=38
    gender=female,male
    level=3
    alignment=neutral
    advances_to=null
    cost=67
    usage=fighter

    description= _ "Deep can already cause harm with their sharp talons. However, those tasked to fight the colony's foes often reinforce their claws with small blades. Their light gambeson allows them to resist hits slightly better while retaining their kind's mobility. "

    [resistance]
        impact=70
    [/resistance]
    [defense]
        deep_water=40
    [/defense]
    die_sound={SOUND_LIST:HUMAN_DIE}


    [attack]
        name=bite
        description=_"fangs"
        type=pierce
        range=melee
        damage=20
        number=3
        icon=fangs-snake.png
    [/attack]
    [attack_anim]
        [filter_attack]
            name=fangs
        [/filter_attack]
        offset=0.0~0.2,0.2~0.7,0.7~0.2,0.2~0.0
        start_time=-160
        [frame]
            image="fighter/deep-fighter-talons[1~4].png:100"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -25}
    [/attack_anim]

    [attack]
        name=spear blast
        description=_"spear blast"
        type=arcane
        range=ranged
        damage=10
        number=3
        icon=attacks/lightbeam.png
    [/attack]

    [attack]
        name=water blast
        description=_"water blast"
        type=impact
        range=ranged
        damage=14
        number=2
        icon=attacks/waterspray.png
    [/attack]
[/unit_type]
