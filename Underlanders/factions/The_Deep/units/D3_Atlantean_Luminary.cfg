#textdomain wesnoth-The_Deep
[unit_type]
    id=Atlantean Luminary
    name= _ "Atlantean Luminary"
    race=Deep
    image="enchantress/deep-enchantress.png"
    profile="enchantress/deep-enchantress-portrait.webp"
    small_profile="enchantress/deep-enchantress-portrait.webp~CROP(0,0,628,628)"
    halo=halo/elven/shyde-stationary-halo[1~6].png:150
    hitpoints=50
    movement_type=Deep_foot
    movement=5
    experience=200
    gender=female,male
    level=3
    alignment=lawful
    advances_to=null
    cost=70
    usage=healer

    description= _ "The legendary Priests of Anubis are beings admired by the majority of people. They carry themselves with grace and confidence, knowing full well the power they hold over the ordinary folk. Thanks to their influence, they develop a network of connections to support their own goals or those they are given by deep lorekeepers."
    [abilities]
        {ABILITY_CURES}
        {ABILITY_ILLUMINATES} #Crystal Beacon
    [/abilities]
    [resistance]
        arcane=120
    [/resistance]
    [defense]
        #fungus=60
    [/defense]
    [movement_costs]
        #cave=1
        #fungus=1
    [/movement_costs]

    [healing_anim]
        start_time=-200
        [frame]
            image="enchantress/deep-enchantress-sing[1~8].png:100"
        [/frame]
        [frame]
            halo=halo/elven/shaman-heal-halo-[1~7].png
        [/frame]
    [/healing_anim]

    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
    [death]
        start_time=0
        [frame]
            image="enchantress/deep-enchantress-death[1~7].png:100,50*6,enchantress/deep-enchantress-death8.png:200"
        [/frame]
    [/death]
    {DEFENSE_ANIM "enchantress/deep-enchantress-hit[1~3].png:75" "enchantress/deep-enchantress.png" {SOUND_LIST:HUMAN_FEMALE_HIT} }
    [standing_anim]
        [frame]
            image="enchantress/deep-enchantress.png"
        [/frame]
    [/standing_anim]
    [standing_anim]
        start_time=0

        submerge=0.01
        [frame]
            image="enchantress/deep-enchantress-fly[1~6].png:100"
        [/frame]
    [/standing_anim]
    [movement_anim]
        start_time=0
        [frame]
            image="enchantress/deep-enchantress-fly[1~6].png:100"
        [/frame]
    [/movement_anim]
    [pre_movement_anim]
        start_time=0

        [frame]
            image="enchantress/deep-enchantress-takeoff.png:100"
        [/frame]
    [/pre_movement_anim]
    [post_movement_anim]
        start_time=0

        [frame]
            image="enchantress/deep-enchantress-land.png:100"
        [/frame]
    [/post_movement_anim]
    [draw_weapon_anim]
        start_time=0

        [frame]
            image="enchantress/deep-enchantress-land.png:100"
        [/frame]
    [/draw_weapon_anim]
    [sheath_weapon_anim]
        start_time=0

        [frame]
            image="enchantress/deep-enchantress-takeoff.png:100"
        [/frame]
    [/sheath_weapon_anim]
    [idle_anim]
        {STANDARD_IDLE_FILTER}
        start_time=0

        [frame]
            image="enchantress/deep-enchantress-idling[1~15].png:100"
        [/frame]
    [/idle_anim]

    [attack]
        name=Water Spray
        description=_"Water Spray"
        icon=attacks/faerie-fire.png
        type=impact
        range=ranged
        damage=13
        number=3
    [/attack]

    [attack_anim]
        [filter_attack]
            name=Water Spray
        [/filter_attack]
        missile_start_time=-100
        [missile_frame]
            offset=1.0
            duration=350
            image=halo/elven/shaman-heal-halo-[1~7].png:50~BLEND(0,76,0,100%)
            auto_vflip=no
        [/missile_frame]
        start_time=-200
        [frame]
            image="enchantress/deep-enchantress-sing[1~8].png:100"
        [/frame]
        {SOUND:HIT_AND_MISS magic-holy-miss-2.ogg magic-holy-miss-1.ogg -75}
        halo_start_time=-150
        [halo_frame]
            halo=halo/saurian-magic-halo-[1~7].png:60
            halo_x,halo_y=0,-12
            auto_vflip=no
        [/halo_frame]
        [frame]
            image="enchantress/deep-enchantress.png:50"
        [/frame]
    [/attack_anim]

    [attack]
        name=Crystal Beam
        description=_"Crystal Beam"
        icon=attacks/faerie-fire.png
        type=arcane
        range=ranged
        damage=9
        number=5
    [/attack]

    [attack_anim]
        [filter_attack]
            name=Crystal Beam
        [/filter_attack]
        missile_start_time=-100
        [missile_frame]
            offset=1.0
            duration=350
            image=halo/elven/shaman-heal-halo-[1~7].png:50~BLEND(0,76,0,100%)
            auto_vflip=no
        [/missile_frame]
        start_time=-200
        [frame]
            image="enchantress/deep-enchantress-sing[1~8].png:100"
        [/frame]
        {SOUND:HIT_AND_MISS magic-holy-miss-2.ogg magic-holy-miss-1.ogg -75}
        halo_start_time=-150
        [halo_frame]
            halo=halo/saurian-magic-halo-[1~7].png:60
            halo_x,halo_y=0,-12
            auto_vflip=no
        [/halo_frame]
        [frame]
            image="enchantress/deep-enchantress.png:50"
        [/frame]
    [/attack_anim]

    [attack_anim]
        [filter_attack]
            name=Judgement
        [/filter_attack]
        missile_start_time=-200
        [missile_frame]
            offset=1.0
            image="misc/deep-wail2-front[1~6].png:75,misc/deep-wail2-front[7~10].png:50"
            auto_vflip=no
        [/missile_frame]
        missile2_start_time=-200
        [missile2_frame]
            offset=1.0
            image="misc/deep-wail2-back[1~6].png:75,misc/deep-wail2-back[7~10].png:50"
            layer=20
            auto_vflip=no
        [/missile2_frame]
        start_time=-200
        [frame]
            image="enchantress/deep-enchantress-sing[1~8].png:100"
            blend_color=176,212,255
            blend_ratio=0.2
        [/frame]
        halo_start_time=-150
        [halo_frame]
            halo=halo/saurian-magic-halo-[1~7].png:60
            halo_x,halo_y=0,-12
            auto_vflip=no
        [/halo_frame]
        attack_sound_start_time=-75
        [attack_sound_frame]
            sound=wail-sml.wav
        [/attack_sound_frame]
        [frame]
            image="enchantress/deep-enchantress.png:50"
            blend_color=176,212,255
            blend_ratio=0.2
        [/frame]
    [/attack_anim]
[/unit_type]
