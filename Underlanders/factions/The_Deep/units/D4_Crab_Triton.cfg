#textdomain wesnoth-The_Deep
[unit_type]
    id=Crab Triton
    name= _ "Crab Triton"
    race=Crab
    image="fighter/deep-fighter2.png"
    image_icon="fighter/deep-fighter2.png~CROP(0,8,72,72)"
    profile="fighter/deep-fighter2.png"
    hitpoints=101
    movement_type=Deep_foot
    movement=5
    experience=200
    gender=male
    level=4
    alignment=neutral
    advances_to=null
    cost=90
    usage=fighter

    description= _ ""

    [abiities]
        {ABILITY_LEADERSHIP_CRAB}
        {ABILITY_FEEDING}
    [/abilities]
    [defense]
        forest=50
        flat=60
        sand=50
        hills=50
        frozen=60
        shallow_water=40
        deep_water=30
    [/defense]
    [resistance]
        impact=70
        cold=80
    [/resistance]

    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
