        [/frame]
    [/death]
    {DEFENSE_ANIM "fighter/deep-fighter-hit[1~3].png:75" "fighter/deep-fighter2.png" {SOUND_LIST:HUMAN_FEMALE_HIT} }

    [attack]
        name=Claws
        description=_"Claws"
        type=impact
        range=melee
        damage=16
        number=2
        icon=attacks/claws-animal.png
    [/attack]

    [attack]
        name=Water Blast
        description=_"Water Blast"
        type=impact
        range=ranged
        damage=12
        number=1
        icon=attacks/claws-animal.png
        # Weapon speials: Knockback?
    [/attack]

    [attack_anim]
        [filter_attack]
            name=Claws
        [/filter_attack]
        offset=0.0~0.2,0.2~0.7,0.7~0.2,0.2~0.0
        start_time=-160
        [frame]
            image="fighter/deep-fighter-talons[1~4].png:100"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -25}
    [/attack_anim]
