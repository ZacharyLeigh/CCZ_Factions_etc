#textdomain wesnoth-The_Deep
[unit_type]
    id=Atlantean Hero
    name= _ "Atlantean Hero"
    race=deep
    image="bowman/deep-bowman3.png"
    image_icon="bowman/deep-bowman3.png~CROP(0,8,72,72)"
    profile="bowman/deep-bowman3.png"
    hitpoints=63
    movement_type=Deep_foot
    movement=5
    experience=150
    gender=female,male
    level=3
    alignment=neutral
    advances_to=null
    cost=63
    usage=archer

    description= _ "Deep can already cause harm with their sharp talons. However, those tasked to fight the colony's foes often reinforce their claws with small blades. Their light gambeson allows them to resist hits slightly better while retaining their kind's mobility. "

    [defense]
        deep_water=50
        shallow_water=40
        swamp=60
    [/defense]
    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}

    [attack]
        name=Torch
        description=_"Torch"
        type=fire
        range=melee
        damage=6
        number=3
        icon=attacks/torch.png
    [/attack]

    [attack]
        name=War Bow
        description=_"War Bow"
        type=pierce
        range=ranged
        damage=14
        number=3
        [specials]
            {WEAPON_SPECIAL_ARCANE}
        [/specials]
        icon=attacks/bow.png
    [/attack]

    [attack]    # Maybe this should be an amla?
        name=Fate Bow
        description=_"Arrow of Fate"
        type=pierce
        range=ranged
        damage=38
        number=1
        [specials]
            {WEAPON_SPECIAL_FOCUSED}
            {WEAPON_SPECIAL_POISON}
            #{WEAPON_SPECIAL_LEATHAL_POISON}
        [/specials]
        icon=attacks/bow.png
    [/attack]
[/unit_type]
