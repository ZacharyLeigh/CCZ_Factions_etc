#textdomain wesnoth-The_Deep
[unit_type]
    id=Atlantean Crystal Crab
    name= _ "Atlantean Crystal Crab"
    race=deep
    image="crab/crystacean_idle1.png"
    image_icon="crab/crystacean_idle1.png~CROP(16,8,100,120)"
    profile="crab/crystacean_idle1.png"
    hitpoints=41
    movement_type=Deep_foot
    movement=5
    experience=44
    gender=female,male
    level=1
    alignment=neutral
    advances_to=Crab Giant
    cost=17
    usage=fighter

    description= _ "Deep can already cause harm with their sharp talons. However, those tasked to fight the colony's foes often reinforce their claws with small blades. Their light gambeson allows them to resist hits slightly better while retaining their kind's mobility. "

    [resistance]
        impact=80
        pierce=80
        blade=80
        cold=70
        fire=140
        arcane=110
    [/resistance]
    [defense]
        forest=70
        swamp=50
        shallow_water=40
        hills=60
        snow=50
        mountains=90
        deep_water=40
        village=60
        castle=70
        flat=70
    [/defense]
    [movement_costs]
        cave=2
        swamp=1
        shallow_water=1
        snow=2
        sand=1
        deep_water=1
        forest=2
        hills=2
        mountains=4
    [/movement_costs]
    die_sound={SOUND_LIST:SKELETON_DIE}
    [death]
        start_time=0
        [frame]
            image="crab/crystacean_death[1~3].png:180"
        [/frame]
    [/death]
    [defend]
        hits=miss
        start_time=-126
        [frame]
            image="crab/crystacean_dodge[1,2,1].png:[60,120,85]"
        [/frame]
    [/defend]
    {DEFENSE_ANIM "crab/crystacean_block2.png" "crab/crystacean_idle1.png" {SOUND_LIST:SKELETON_HIT} }

    [standing_anim]
        start_time=0
        [frame]
            image="crab/crystacean_idle[1~2].png:1600"
        [/frame]
    [/standing_anim]
    [movement_anim]
        start_time=0
        [frame]
            image="crab/crystacean_move[1~3].png:180"
        [/frame]
    [/movement_anim]

    [attack]
        name=pincers
        description=_"pincers"
        type=blade
        range=melee
        damage=8
        number=2
        icon=attacks/pincers.png
    [/attack]

    [attack_anim]
        [filter_attack]
            name=pincers
        [/filter_attack]
        offset=0.1~0.3,0.3~0.8,0.7~0.2,0.2~0.0
        start_time=-160
        [frame]
            image="crab/crystacean_atk[1~3].png:180"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -25}
    [/attack_anim]
[/unit_type]
