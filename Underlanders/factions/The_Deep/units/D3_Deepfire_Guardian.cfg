#textdomain wesnoth-The_Deep
[unit_type]
    id=Deepfire Guardian
    name= _ "Deepfire Guardian"
    race=deep
    image="bowman/deep-bowman3.png"
    image_icon="bowman/deep-bowman3.png~CROP(0,8,72,72)"
    profile="bowman/deep-bowman3.png"
    hitpoints=63
    movement_type=Deep_foot
    movement=6
    experience=150
    gender=female,male
    level=3
    alignment=neutral
    advances_to=null
    cost=48
    usage=fighter

    description= _ "Deep can already cause harm with their sharp talons. However, those tasked to fight the colony's foes often reinforce their claws with small blades. Their light gambeson allows them to resist hits slightly better while retaining their kind's mobility. "

    [defense]
        deep_water=50
        shallow_water=40
        swamp=60
    [/defense]
    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
    [resistance]
        fire=90
        arcane=90
    [/resistance]

    [attack]
        name=Torch
        description=_"Torch"
        type=fire
        range=melee
        damage=6
        number=6
        [specials]
            #{WEAPON_SPECIAL_DAZZLE}    #needs to be an event ability
            {WEAPON_SPECIAL_ARCANE}
        [/specials]
        icon=attacks/torch.png
    [/attack]

    [attack]
        name=Fire Breath
        description=_"Fire Breath"
        type=fire
        range=ranged
        damage=19
        number=1
        icon=attacks/fireball.png
    [/attack]
[/unit_type]
