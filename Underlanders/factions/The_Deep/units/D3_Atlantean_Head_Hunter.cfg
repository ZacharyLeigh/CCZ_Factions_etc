#textdomain wesnoth-The_Deep
[unit_type]
    id=Head Hunter
    name= _ "Atlantean Head Hunter"
    race=Deep1
    image="unit_assests/Ekosian_Soldier/E_soldier64.png"
    image_icon="unit_assests/Ekosian_Soldier/E_soldier64.png~CROP(0,8,72,72)"
    profile="unit_assests/Ekosian_Soldier/E_soldier64.png"
    hitpoints=55
    movement_type=Deep_foot #flying
    movement=8
    experience=175
    gender=female,male
    level=3
    alignment=neutral
    advances_to=null
    cost=63
    usage=scout

    description= _ "Deep can already cause harm with their sharp talons. However, those tasked to fight the colony's foes often reinforce their claws with small blades. Their light gambeson allows them to resist hits slightly better while retaining their kind's mobility. "

    [abilities]
        {ABILITY_SKIRMISHER}
    [/abilities]
    [resistance]
        impact=120
        pierce=90
    [/resistance]
    [defense]
        village=60
        castle=60
        cave=30
        forest=60
        flat=50
        sand=50
        hills=50
        Mountain=40
        frozen=50
        shallow_water=60
        deep_water=70
    [/defense]

    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
    [death]
        start_time=0
        [frame]
            image="fighter/deep-fighter-death[1~6].png:100,50*5,fighter/deep-fighter-death7.png:200"
        [/frame]
    [/death]
    {DEFENSE_ANIM "fighter/deep-fighter-hit[1~3].png:75" "fighter/deep-fighter2.png" {SOUND_LIST:HUMAN_FEMALE_HIT} }

    [standing_anim]
        start_time=0
        [frame]
            image="fighter/deep-fighter-fly[1~6].png:100"
        [/frame]
    [/standing_anim]
    [movement_anim]
        start_time=0
        [frame]
            image="fighter/deep-fighter-fly[1~6].png:100"
        [/frame]
    [/movement_anim]
    [idle_anim]
        {STANDARD_IDLE_FILTER}
        start_time=0
        [frame]
            image="fighter/deep-fighter-idling[1~9].png:100,fighter/deep-fighter-fly[4~6].png:100"
        [/frame]
    [/idle_anim]

    [attack]
        name=Harpoon
        description=_"Harpoon"
        type=pierce
        range=melee
        damage=11
        number=3
        icon=attacks/spear-orcish.png
    [/attack]
    [attack_anim]
        [filter_attack]
            name=Harpoon
        [/filter_attack]
        offset=0.0~0.2,0.2~0.7,0.7~0.2,0.2~0.0
        start_time=-160
        [frame]
            image="fighter/deep-fighter-talons[1~4].png:100"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -25}
    [/attack_anim]

    [attack]
        name=Harpoon
        description=_"Harpoon"
        type=arcane
        range=ranged
        damage=9
        number=3
        [specials]
            {WEAPON_SPECIAL_SLOW} #Pinned (Movement drops to 0)
            {WEAPON_SPECIAL_MARKSMAN}
        [/specials]
        icon=attacks/spear-orcish.png
    [/attack]
    [attack_anim]
        [filter_attack]
            name=Harpoon
        [/filter_attack]
        offset=0.0~0.2,0.2~0.7,0.7~0.2,0.2~0.0
        start_time=-160
        [frame]
            image="fighter/deep-fighter-talons[1~4].png:100"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -25}
    [/attack_anim]

[/unit_type]

