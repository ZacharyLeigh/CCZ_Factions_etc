#textdomain wesnoth-The_Deep
[unit_type]
    id=Atlantean Diplomat
    name= _ "Atlantean Diplomat"
    race=Deep
    image="nightdeep/night-deep.png"
    profile="nightdeep/night-deep-portrait.webp"
    small_profile="nightdeep/night-deep-portrait.webp"
    hitpoints=30
    movement_type=Deep_foot
    movement=6
    experience=30
    gender=female,male
    level=1
    alignment=lawful
    advances_to=Atlantean Ambassador
    cost=12
    usage=fighter mixed

    [male]
        gender=male
    profile="nightdeep/night-deep-portrait-male.webp"
    small_profile="nightdeep/night-deep-portrait.webp"
        die_sound={SOUND_LIST:HUMAN_DIE}
        {DEFENSE_ANIM "nightdeep/night-deep-hitb[1~3,1].png:[75*3,1]" "nightdeep/night-deep.png" {SOUND_LIST:HUMAN_HIT} }
    [/male]

    description= _ "While most Deep prefer to build their homes in the caves dotting seashore cliffs and tall mountains, some have chosen to seek shelter in forests. This new environment has made them change their hunting techniques, which now rely on stealth a lot more. Over time their body evolved and they can now fly silently, which makes them extremely hard to notice at night. "

    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
    [death]
        start_time=0
        [frame]
            image="nightdeep/night-deep-death[1~5].png:100,50*4,nightdeep/night-deep-death6.png:200"
        [/frame]
    [/death]
    {DEFENSE_ANIM "nightdeep/night-deep-hitb[1~3,1].png:[75*3,1]" "nightdeep/night-deep.png" {SOUND_LIST:HUMAN_FEMALE_HIT} }

    [standing_anim]
        [frame]
            image="nightdeep/night-deep.png"
        [/frame]
    [/standing_anim]
    [standing_anim]
        start_time=0

        submerge=0.01
        [frame]
            image="nightdeep/night-deep-fly[5,6,1~4].png:100"
        [/frame]
    [/standing_anim]
    [movement_anim]
        start_time=0
        [frame]
            image="nightdeep/night-deep-fly[5,6,1~4].png:100"
        [/frame]
    [/movement_anim]
    [pre_movement_anim]
        start_time=0
        [frame]
            image="nightdeep/night-deep-takeoff.png:100"
        [/frame]
    [/pre_movement_anim]
    [post_movement_anim]
        start_time=0
        [frame]
            image="nightdeep/night-deep-land.png:100"
        [/frame]
    [/post_movement_anim]
    [draw_weapon_anim]
        start_time=0
        [frame]
            image="nightdeep/night-deep-land.png:100"
        [/frame]
    [/draw_weapon_anim]
    [sheath_weapon_anim]
        start_time=0
        [frame]
            image="nightdeep/night-deep-takeoff.png:100"
        [/frame]
    [/sheath_weapon_anim]
    [idle_anim]
        {STANDARD_IDLE_FILTER}

        start_time=0
        [frame]
            image="nightdeep/night-deep-idling[1~6].png:[100*2,300,100,300,100],nightdeep/night-deep-idling3.png:100"
        [/frame]
    [/idle_anim]

    [attack]
        name=Crystal Curse
        description=_"Crystal Curse"
        type=arcane
        range=ranged
        damage=4
        number=4
        [specials]
            {WEAPON_SPECIAL_MAGICAL}
        [/specials]
        icon=attacks/claws-shadow.png
    [/attack]

    [attack_anim]
        [filter_attack]
            name=Dagger
        [/filter_attack]
        offset=0.0~0.2:300,0.2~0.7:200,0.7~0.2:200,0.2~0.0:100
        start_time=-400
        [frame]
            image="nightdeep/night-deep-talon[1~6].png:100"
        [/frame]
        {SOUND:HIT_AND_MISS claws.ogg dagger-swish.wav -100}
    [/attack_anim]

    [attack_anim]
        [filter_attack]
            name=Curse
        [/filter_attack]
        offset=0.0~0.2:300,0.2~0.7:200,0.7~0.2:200,0.2~0.0:100
        start_time=-400
        [frame]
            image="nightdeep/night-deep-talon[1~6].png:100"
        [/frame]
        {SOUND:HIT_AND_MISS claws.ogg dagger-swish.wav -100}
    [/attack_anim]
[/unit_type]
