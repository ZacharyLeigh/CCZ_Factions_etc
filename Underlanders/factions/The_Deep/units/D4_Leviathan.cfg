#textdomain wesnoth-The_Deep
#based off of rough rinos, 3rd ranged is the walking foretress with a catapult, melee gets polearm stuff

[unit_type]
    id=Leviathan
    name= _ "Leviathan"
    race=deep
    image="falconeer/harpy-falconeer.png"
    image_icon="falconeer/harpy-falconeer.png"
    profile="falconeer/harpy-falconeer-portrait-female.webp"
    small_profile="falconeer/harpy-falconeer-portrait-female.webp~CROP(0,0,562,703)"
    hitpoints=111
    movement_type=hivedeep
    movement=8
    experience=200
    gender=female,male
    level=4
    alignment=neutral
    advances_to=Null
    cost=99
    usage=fighter

    description= _ "The fear of all sea dwellers alike since ancient times..."
    
    [defense]
        shallow_water=50
        swamp_water=60
        cave=30
    [/defense]
    [resistance]
        arcane=80
    [/resistance]
    
    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
    [death]
        start_time=0
        [frame]
            image="falconeer/harpy-falconeer-death[1~9].png:[100,50*8]"
        [/frame]
    [/death]

    {DEFENSE_ANIM "falconeer/harpy-falconeer-hit[1~3,1].png:[75*3,1]" "falconeer/harpy-falconeer.png" {SOUND_LIST:HUMAN_FEMALE_HIT} }

    [standing_anim]
        [frame]
            image="falconeer/harpy-falconeer.png"
        [/frame]
    [/standing_anim]
    [movement_anim]
        start_time=0
        [frame]
            image="falconeer/harpy-falconeer-flyb[1~4].png:150"
        [/frame]
    [/movement_anim]

    [attack]
        name=spine slash
        description=_"spine slash"
        type=blade
        range=melee
        damage=34
        number=1
        icon=attacks/claws-animal.png
    [/attack]
    
    [attack]
        name=pincers
        description=_"pincers"
        type=impact
        range=melee
        damage=20
        number=2
        icon=attacks/claws-animal.png
    [/attack]
    
    [attack]
        name=primordial blast
        description=_"Primordial Blast"
        type=arcane
        range=ranged
        damage=30
        number=1
        icon=attacks/claws-animal.png
    [/attack]

    [attack_anim]
        [filter_attack]
            name=spine slash
        [/filter_attack]
        offset=0.0~0.2,0.2~0.7,0.7~0.2,0.2~0.0
        start_time=-260
        [frame]
            image="falconeer/harpy-falconeer-talonb[1~7].png:100"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -25}
    [/attack_anim]
    
    [attack_anim]
        [filter_attack]
            name=pincers
        [/filter_attack]
        offset=0.0~0.2,0.2~0.7,0.7~0.2,0.2~0.0
        start_time=-260
        [frame]
            image="falconeer/harpy-falconeer-talonb[1~7].png:100"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -25}
    [/attack_anim]

    [attack_anim]
        [filter_attack]
            name=primordial blast
        [/filter_attack]
        start_time=-500
        [frame]
            image="falconeer/harpy-falconeer-falconhunt[1~8].png:[100*4,100,100*3]"
        [/frame]
        missile_start_time=-200
        [if]
            direction=nw,ne,n
            [missile_frame]
                halo="falconeer/harpy-falconeer-falconlunge[4,5].png:[150,50],falconeer/harpy-falconeer-falconlunge1.png~FL(horiz):100"
                offset=0.0~1.0,1.0~0.0
                halo_y=0:200,0~-20:100
                auto_vflip=no
            [/missile_frame]
        [/if]
        [else]
            direction=sw,se,s
            [missile_frame]
                halo="falconeer/harpy-falconeer-falconlunge[1,2,3].png:[100,50*2],falconeer/harpy-falconeer-falconlunge4.png~FL(horiz):100"
                offset=0.0~1.0,1.0~0.0
                halo_y=0:200,0~-20:100
                auto_vflip=no
            [/missile_frame]
        [/else]

        {SOUND:HIT_AND_MISS claws.ogg {SOUND_LIST:MISS} -25}
        [frame]
            image="falconeer/harpy-falconeer.png:50"
        [/frame]
    [/attack_anim]
    
[/unit_type]
