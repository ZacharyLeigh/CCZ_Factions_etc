#textdomain wesnoth-The_Deep
[unit_type]
    id=King Crab
    name= _ "King Crab"
    race=Crab
    image="fighter/deep-fighter2.png"
    image_icon="fighter/deep-fighter2.png~CROP(0,8,72,72)"
    profile="fighter/deep-fighter2.png"
    hitpoints=80
    movement_type=Deep_foot
    movement=5
    experience=200
    gender=male
    level=3
    alignment=neutral
    advances_to=Crab Triton
    cost=60
    usage=fighter

    description= _ "Stag Beatle Riders... Not quite as fast as horsemen on regular terrain, but a bit tougher, and better at dealing with rocks, hills, and brambles."

    [abilities]
        #{ABILITY_LEADERSHIP_CRAB}
        {ABILITY_FEEDING}
    [/abilities]
    [defense]
        forest=50
        flat=60
        sand=50
        hills=50
        frozen=60
        shallow_water=40
        deep_water=30
    [/defense]
    [resistance]
        impact=70
    [/resistance]

    die_sound={SOUND_LIST:HUMAN_DIE}
    [death]
        start_time=0
        [frame]
            image="fighter/deep-fighter-death[1~6].png:100,50*5,fighter/deep-fighter-death7.png:200"
        [/frame]
    [/death]
    {DEFENSE_ANIM "fighter/deep-fighter-hit[1~3].png:75" "fighter/deep-fighter2.png" {SOUND_LIST:HUMAN_FEMALE_HIT} }

    [attack]
        name=pincers
        description=_"pincers"
        type=blade
        range=melee
        damage=16
        number=2
        icon=attacks/claws-animal.png
    [/attack]

    [attack]
        name=water blast
        description=_"water blast"
        type=impact
        range=ranged
        damage=10
        number=1
        icon=attacks/waterspray.png
    [/attack]
[/unit_type]
