#textdomain wesnoth-The_Deep

 # it may be that there an only be one utils.cfg per add on, so this will need to be copied to the underlanders folder

#define DEEP_TRAIT_RESOURCE
    [resource]
        id = "tide_trait_data"
        [deep_data]
            [trait_]
                {TIDE_HIGH}
            [/trait_heroic]
            [trait_heroic]
                {TIDE_LOW}
            [/trait_heroic]
            [trait_heroic]
                {TIDE_NEAP}
            [/trait_heroic]
            [trait_heroic]
                {TIDE_EBB}
            [/trait_heroic]
        [/deep_data]
    [/resource]
#enddef

#define WEAPON_SPECIAL_FOCUSED
	[chance_to_hit]
		id=focused
		name= _ "focused"
		description= _ "This attack always has at least a 80% chance to hit."
		value=80
		cumulative=yes
	[/chance_to_hit]
#enddef

#define ABILITY_ROYAL_CRAB
    # Leadership for only crabs.
    [leadership]  
        id=royal_crab
        name=_ "Royal Crab"
        description=_ "The presence of a royal crab inspires all nearby crabs  to fight harder."
        affect_self=no
        value="(20 * (level - other.level + 1))"
        cumulative=no
        [filter_student]
            race=crab
            [filter]
                formula="level < other.level"
            [/filter]
        [/filter_student]
        [affect_adjacent]
        [/affect_adjacent]
    [/leadership]
#enddef

#define WEAPON_SPECIAL_SUCK AMT
    [drains]
        id=drains
        name= _ "drains"
        description= _ "This unit drains health from living units, healing itself for half the amount of damage it deals (rounded down)."
        special_note={INTERNAL:SPECIAL_NOTES_DRAIN}

    [/drains]
#enddef

#define ABILITY_HEALS_8
    [heals]
        value=8
        id=healing
        affect_allies=yes
        name= _ "heals +8"
        female_name= _ "female^heals +8"
        description=  _ "Allows the unit to heal adjacent allied units at the beginning of our turn.
A unit cared for by this healer may heal up to 8 HP per turn, or stop poison from taking effect for that turn.
This ability will not cure an affected unit of poison, however, only delay its effect."
        affect_self=no
        poison=slowed
        [affect_adjacent]
        [/affect_adjacent]
    [/heals]
#enddef

#define WEAPON_SPECIAL_DAZZLE
	[dummy]
		id=dazzle
		name= _ "dazzle"
		description= _ "This weapon special reduces the target's chance to hit by 3% with every hit. The reduction halves at every turn."
	[/dummy]
#enddef

#define ABILITY_CRYSTAL_BEACON AMT
    [damage]
        id=crystal_beacon
        name= _ "crystal beacon"
        description= _ "This unit's crystal beacon eminates powerful magical energy, amplifying all arcane attacks around it."
        multiply={AMT}
        affect_self=no
        [filter_student]
            [filter_weapon]
                type=arcane
            [/filter_weapon]
        [/filter_student]
        [affect_adjacent]
        [/affect_adjacent]
    [/damage]
#enddef

