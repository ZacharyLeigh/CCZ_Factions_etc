#define ABILITY_CRYSTAL_BEACON_EVENT
    [event]
        name=attack
        first_time_only=no
        [filter_attack]
            type=arcane
        [/filter_attack]
        [filter_adjacent]
            # is_enemy=no
            has_ability=crystal_beacon
        [/filter_adjacent]
        [message]
            message=_ "The crystal beacon amplifies the arcane damage!"
        [/message]
        [effect]
            apply_to=attack
            [filter_attack]
                type=arcane
            [/filter_attack]
            increase_damage=30%
        [/effect]
    [/event]
#enddef

