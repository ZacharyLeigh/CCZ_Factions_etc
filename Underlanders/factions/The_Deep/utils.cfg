#define ABILITY_CRYSTAL_BEACON
    # [dummy]
    #     id=crystal_beacon
    #     name=_ "Crystal Beacon"
    #     description=_"This unit's crystal beacon eminates powerful magical energy, amplifying all arcane attacks around it."
    # [/dummy]
    [damage]
        id=crystal_beacon
        name= _ "crystal beacon"
        description= _ "This unit's crystal beacon eminates powerful magical energy, amplifying all arcane attacks around it."
        multiply=1.2
        affect_self=no
        [filter_student]
            [filter_weapon]
                type=arcane
            [/filter_weapon]
        [/filter_student]
        [affect_adjacent]
        [/affect_adjacent]
    [/damage]
#enddef
