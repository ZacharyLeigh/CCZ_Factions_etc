#define EVENT_START_MAP_WITH_DEEP
    [event] # This event adds the tide traits to a unit of the Deep faction when it is recruited.
        name=start
        first_time_only=yes
        [filter_second]
            race=deep
        [/filter_second]
        [filter]
            time_of_day=first_watch,second_watch
            [effect]
                #{TIDE_SHORTCUT TIDE_HIGH}
                [modifications]
                    {TIDE_HIGH}
                [/modifications]
            [/effect]
        [/filter]
        [filter]
            time_of_day=dawn
            [effect]
                {TIDE_EBB}
            [/effect]
        [/filter]
        [filter]
            time_of_day=morning,afternoon
            [effect]
                apply_to="neap tide"
            [/effect]
        [/filter]
        [filter]
            time_of_day=dusk
            [effect]
                apply_to="flood tide"
            [/effect]
        [/filter]
    [/event]
#enddef

#define EVENT_RECRUIT_DEEP
    [event] # This event adds the tide traits to a unit of the Deep faction when it is recruited.
        name=recruit
        first_time_only=no
        [filter_second]
            race=deep
        [/filter_second]
        [filter]
            time_of_day=first_watch,second_watch
            [effect]
                [modifications]
                    #{TIDE_SHORTCUT TIDE_HIGH}
                    {TIDE_HIGH}
                [/modifications]
            [/effect]
        [/filter]
        [filter]
            time_of_day=dawn
            [effect]
                {TIDE_EBB}
            [/effect]
        [/filter]
        [filter]
            time_of_day=morning,afternoon
            [effect]
                apply_to="neap tide"
            [/effect]
        [/filter]
        [filter]
            time_of_day=dusk
            [effect]
                apply_to="flood tide"
            [/effect]
        [/filter]
    [/event]
#enddef

