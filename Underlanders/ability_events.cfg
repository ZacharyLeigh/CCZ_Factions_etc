#define ABILITY_EVENTS
[event]             # Scavenger
    name=die
    [filter_self]
    [/filter_self]
    [filter_adjecent]
        is_enemy=yes
        ability=ABILITY_SCAVENGER
        [effect]
            apply_to=hitpoints
            add=2
        [/effect]
    [/filter_adjecent]
[/event]

[event]             # SUCK attacker
    name=attacker_hits
    [filter_self]
        special=WEAPON_SPECIAL_SUCK
        [effect]
            apply_to=hitpoints
            add={VAL}
        [/effect]
    [/filter_self]
[/event]
[event]             # SUCK defender
    name=defender_hits
    [filter_self]
        special=WEAPON_SPECIAL_SUCK
        [effect]
            apply_to=hitpoints
            add={VAL}
        [/effect]
    [/filter_self]
[/event]


#enddef