#textdomain wesnoth-Underlanders
{./factions}

[era]
    id=Default_Underlanders
    name= _ "Default + Underlanders"
    require_era=yes
    description= _ "Mainline factions+dunefolk and the Underlanders."

    ##{RANDOM_SIDE}
    {ERA_DEFAULT}
    {multiplayer/factions/dunefolk-default.cfg}
    {~add-ons/Underlanders/factions/The_Deep/faction/Deep.cfg}
    {~add-ons/Underlanders/factions/The_High_Kingdom/faction/high_kingdom.cfg}
    {~add-ons/Underlanders/factions/The_Hive/faction/hive.cfg}

    {QUICK_4MP_LEADERS}
    {TURNS_OVER_ADVANTAGE}
[/era]

[era]
    id=Aoh_Underlanders
    name= _ "Age of Heroes + The Underlands"
    require_era=yes
    description= _ "Mainline factions+dunefolk and the Underlands, all with lv3 leaders and lv1-2 recruits."

    {ERA_HEROES}
    {multiplayer/factions/dunefolk-aoh.cfg}
    {~add-ons/Underlanders/factions/The_Deep/faction/Deep-aoh.cfg}
    {~add-ons/Underlanders/factions/The_High_Kingdom/faction/high_kingdom-aoh.cfg}
    {~add-ons/Underlanders/factions/The_Hive/faction/hive-aoh.cfg}

    {QUICK_4MP_LEADERS}
    {TURNS_OVER_ADVANTAGE}
[/era]

[era]
    id=Aol_Underlanders
    name= _ "Age of legends + The Underlands"
    require_era=yes
    description= _ "Mainline factions+dunefolk and the Underlands, lv3 leaders and lv1-2 recruits, +lv4 and lv5 unique Underlands leaders."

    {ERA_HEROES}
    {multiplayer/factions/dunefolk-aoh.cfg}
    {~add-ons/Underlanders/factions/The_Deep/faction/Deep-aol.cfg}
    {~add-ons/Underlanders/factions/The_High_Kingdom/faction/high_kingdom-aol.cfg}
    {~add-ons/Underlanders/factions/The_Hive/faction/hive-aol.cfg}

    {QUICK_4MP_LEADERS}
    {TURNS_OVER_ADVANTAGE}
[/era]

#define FACTION_RESOURCES
    ## this is needed in both the era and the campaign, in particular in the campaign this data is used to generate the deserters and the ai sides.
    [resource]
        id = "faction_resources"

    [/resource]
#enddef