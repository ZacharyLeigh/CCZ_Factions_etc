#define ABILITY_ROBBERY
    [dummy]
        id=robbery
        name=_"robbery"
        description=_"When this unit kills an enemy unit, gain gold equal to 1 plus 2 times the slain unit's level"
    [/dummy]
    # ideas
    # -This unit could have the trait treacherous, where it costs 1 extra upkeep per turn
    #  or this could be it turns rogue if you go negative in money
    #  > I think turn rogue is the better, but harder option
    # -feral units immune to robbery
    # -pirates can't be loyal
#enddef
#define ABILITY_ROBBERY_EVENT
    [event]			#Pirates rob
	    name=die
	    first_time_only=no
        [filter]
            [not]
                trait=feral
            [/not]
        [/filter]
	    [filter_second]
	    	ability=robbery
	    [/filter_second]
	    {VARIABLE gold_stolen $unit.level}
#        [set_variable]
#            # error: trying to set a variable with an empty name
#            # error: unknown conditional value [gold] (2)
#            name=gold_stolen
#            add=$gold_stolen
#            add=1
#        [/set_variable]
	    [gold]
	    	side=$second_unit.side
	    	amount=$gold_stolen
	    [/gold] 
	    [floating_text]
	    	x,y=$x1,$y1
	    	text="<span color='yellow'>" + _ "+$gold_stolen gold" + "</span>"
	    [/floating_text]
	    {CLEAR_VARIABLE gold_stolen}
	[/event]
#enddef

#define ABILITY_SKULK
    [hides]
        id=skulk_underlands
        name= _ "skulk"
        name_inactive= _ "skulk"
        description= _ "This unit can hide in swamps and shallow water, and remain undetected by its enemies.

Enemy units cannot see this unit while it is in a swamp or shallow water hex, except if they have units next to it. Any enemy unit that first discovers this unit immediately loses all its remaining movement."
        description_inactive= _ "This unit can hide in swamps and shallow water, and remain undetected by its enemies.

Enemy units cannot see this unit while it is in a swamp or shallow water hex, except if they have units next to it. Any enemy unit that first discovers this unit immediately loses all its remaining movement."
        affect_self=yes
        [filter_self]
            [filter_location]
                terrain=Chs,Khs,Ss,Ss^Vhs,Ss^Vm,Wst,St
            [/filter_location]
        [/filter_self]
    [/hides]
#enddef

#define WEAPON_SPECIAL_CHAOS
    [dummy]
        id=chaos
        name= _ "chaos"
        female_name= _ "female^chaos"
        description= _ "This attack can have un predictable effects"
    [/dummy]
#enddef
#define WEAPON_SPECIAL_CHAOS_EVENT
    [event]
        name=attacker_hits
        first_time_only=no
        [filter_attack]
            special=chaos
        [/filter_attack]
        {VARIABLE_OP val rand(-4..4)}
        [if]
            [variable]
                name=val
                greater_than=0
            [/variable]
            [then]
                [filter_second]
                    is_enemy=yes
                [/filter_second]
                [harm_unit]
                    amount=$val
                    [filter]
                        [filter_second]
                            is_enemy=yes
                        [/filter_second]
                    [/filter]
                [/harm_unit]
            [/then]
            [elseif]
                [variable]
                    name=val
                    less_than=0
                [/variable]
                [then]
                    [filter_second]
                        [heals]
                            amount=-$val
                            [filter]
                                [filter_second]
                                    is_enemy=yes
                                [/filter_second]
                            [/filter]
                        [/heals]
                    [/filter_second]
                [/then]
            [/elseif]
        [/if]
#        [harm_unit]
#            # error: this filter seems to apply to everyone on the map
#            # amount="val - 4"
#            [filter]
#                [filter_second]
#                    is_enemy=yes
#                [/filter_second]
#            [/filter]
#            amount=$val
#        [/harm_unit]
        
#	    [floating_text]
#	    	x,y=$x1,$y1
#	    	text="<span color='green'>" + _ "4" + "</span>"
#	    [/floating_text]
        {CLEAR_VARIABLE val}
    [/event]
#enddef

