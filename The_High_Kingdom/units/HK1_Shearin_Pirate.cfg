#textdomain wesnoth-The_High_Kingdom
[unit_type]
    id=Shearin Pirate
    name= _ "Shearin Pirate"
    race=high_kingdom
    image="unit_assests/pirate/pirate64.png"
    #image_icon="pirate/pirate64.png~CROP(0,8,72,72)"
    profile="unit_assests/pirate/pirate64.png"
    hitpoints=37
    movement_type=hk1_foot
    movement=6
    experience=40
    gender=male
    level=1
    alignment=chaotic
    advances_to=Shearin Buccaneer
    cost=13
    usage=fighter

    description= _ "Underlands can already cause harm with their sharp talons. However, those tasked to fight the colony's foes often reinforce their claws with small blades. Their light gambeson allows them to resist hits slightly better while retaining their kind's mobility. "

    [abilities]
        {ABILITY_ROBBERY}
    [/abilities]

    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
    [death]
        start_time=0
        [frame]
            image="unit_assests/pirate/pirate-death[1~6].png:100,50*5,unit_assests/pirate/pirate-death7.png:200"
        [/frame]
    [/death]
    {DEFENSE_ANIM "unit_assests/pirate/pirate-hit[1~3].png:75" "unit_assests/pirate/pirate-64.png" {SOUND_LIST:HUMAN_FEMALE_HIT} }

    [standing_anim]
        start_time=0
        [frame]
            image="unit_assests/pirate/pirate-stand[1~6].png:100"
        [/frame]
    [/standing_anim]
    [movement_anim]
        start_time=0
        [frame]
            image="unit_assests/pirate/pirate-fly[1~6].png:100"
        [/frame]
    [/movement_anim]
    [idle_anim]
        {STANDARD_IDLE_FILTER}
        start_time=0
        [frame]
            image="unit_assests/pirate/pirate-idling[1~9].png:100,unit_assests/pirate/pirate-fly[4~6].png:100"
        [/frame]
    [/idle_anim]

    [attack]
        name=scimitar
        description=_"scimitar"
        type=blade
        range=melee
        damage=6
        number=3
        icon=attacks/scimitar.png
    [/attack]

    [attack_anim]
        [filter_attack]
            name=scimitar
        [/filter_attack]
        offset=0.0~0.2,0.2~0.7,0.7~0.2,0.2~0.0
        start_time=-160
        [frame]
            image="unit_assests/pirate/pirate[1~4].png:100"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -25}
    [/attack_anim]
[/unit_type]
