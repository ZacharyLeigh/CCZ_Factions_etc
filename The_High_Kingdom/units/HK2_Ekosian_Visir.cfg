#textdomain wesnoth-The_High_Kingdom
[unit_type]
    id=Ekosian Visir
    name= _ "Ekosian Visir"
    race=high_kingdom
    image="unit_assests/initiate/visir64.png"
    #image_icon="initiate/visir64.png~CROP(0,0,72,72)"
    profile="unit_assests/initiate/visir64.png"
    #small_profile="initiate/visir64.png~CROP(0,0,686,580)"
    hitpoints=45
    movement_type=hk1_foot
    movement=5
    experience=90
    gender=female,male
    level=2
    alignment=lawful
    advances_to=null
    cost=20
    usage=mixed fighter


    [advancement]
        id=male_upgrade
        description= _ "Sun Seer"
        experience=90
        [filter]
            gender=male
        [/filter]
        [effect]
            apply_to=type
            replace=yes
            value=Sun Seer_male
        [/effect]
    [/advancement]

    [advancement]
        id=female_upgrade
        description= _ "Night Maiden"
        experience=90
        [filter]
            gender=female
        [/filter]
        [effect]
            apply_to=type
            replace=yes
            value=Night Maiden_Female
        [/effect]
    [/advancement]


    description= _ "Ekosian visirs coordinate units with practiced signals and commanding presence. Skilled at directing troops and supporting assaults, they bolster allies with tactical calls and battlefield insight."

    die_sound={SOUND_LIST:HUMAN_DIE}
    [death]
        start_time=0
        [frame]
            image="unit_assests/initiate/Visir-death[1~10].png:[100,50*9]"
        [/frame]
    [/death]

    {DEFENSE_ANIM "unit_assests/initiate/Visir-defend[1~3].png:75" "unit_assests/initiate/visir64.png" {SOUND_LIST:HUMAN_FEMALE_HIT} }

    [standing_anim]
        [frame]
            image="unit_assests/initiate/visir-stand[1~4].png:200"
        [/frame]
    [/standing_anim]
    [standing_anim]
        start_time=0
        submerge=0.01
        [frame]
            image="unit_assests/initiate/visir-stand[1~4].png:150"
        [/frame]
    [/standing_anim]
    [movement_anim]
        start_time=0
        [frame]
            image="unit_assests/initiate/visir-move[1~4].png:150"
        [/frame]
    [/movement_anim]
    
    [idle_anim]
        {STANDARD_IDLE_FILTER}

        start_time=0
        [frame]
            image="unit_assests/initiate/visir-idle[1~5].png:100"
        [/frame]
    [/idle_anim]

    [attack]
        name=Club
        description=_"Club"
        type=impact
        range=melee
        damage=5
        number=3
        icon=attacks/club-small.png
    [/attack]

    [attack]
        name=Light Ray
        description=_"Light Ray"
        type=arcane
        range=ranged
    [specials]
            {WEAPON_SPECIAL_MAGICAL}
    [/specials]
        damage=8
        number=3
        icon=attacks/lightbeam.png
    [/attack]

    [attack_anim]
        [filter_attack]
            name=club
        [/filter_attack]
        offset=0.0~0.2,0.2~0.7,0.7~0.2,0.2~0.0
        start_time=-260
        [frame]
            image="unit_assests/initiate/visir-spear[1~5].png:100"
        [/frame]
        {SOUND:HIT_AND_MISS spear.ogg {SOUND_LIST:MISS} -25}
    [/attack_anim]

    [attack_anim]
        [filter_attack]
            name=Light Ray
        [/filter_attack]
        start_time=-500
        [frame]
            image="unit_assests/initiate/visir-ability[1~9].png:[100*4,70*2,60,100*2]"
        [/frame]
        missile_start_time=-200
        [if]
            direction=nw,ne,n
            [missile_frame]
                halo="halo/saurian-magic-halo-[1~7].png:60"
                offset=0.0~1.0,1.0~0.0
                halo_x=20~0:200,0~20:100
                halo_y=-20~0:200,0~-20:100
                auto_vflip=no
            [/missile_frame]
        [/if]
        [else]
            direction=sw,se,s
            [missile_frame]
                halo="halo/saurian-magic-halo-[1~7].png:60"
                offset=0.0~1.0,1.0~0.0
                halo_x=20~0:200,0~20:100
                halo_y=-20~0:200,0~-20:100
                auto_vflip=no
            [/missile_frame]
        [/else]

        {SOUND:HIT_AND_MISS claws.ogg {SOUND_LIST:MISS} -25}
        [frame]
            image="unit_assests/initiate/visir64.png:50"
        [/frame]
    [/attack_anim]
[/unit_type]
