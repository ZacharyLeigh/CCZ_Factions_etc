#textdomain wesnoth-The_High_Kingdom
[unit_type]
    id=Ibian Great Chief
    name= _ "Ibian Great Chief"
    race=high_kingdom
    image="unit_assests/Ibian_Great_Chief/Ibian_Great_Chief-featherlord.png"
    image_icon="unit_assests/Ibian_Great_Chief/Ibian_Great_Chief-featherlord.png"
    profile="unit_assests/Ibian_Great_Chief/Ibian_Great_Chief-featherlord-portrait-female.webp"
    small_profile="unit_assests/Ibian_Great_Chief/Ibian_Great_Chief-featherlord-portrait-female.webp~CROP(0,0,686,580)"
    hitpoints=62
    movement_type=high_kingdom_foot
    movement=7
    experience=100
    gender=female,male
    level=3
    alignment=lawful
    advances_to=null
    {AMLA_FEATHERLORD}
    cost=65
    usage=mixed fighter

    description= _ "Harpy commanders use their bird companion and specific calls to quickly transmit orders on the battlefield. Their brightly colored flag helps them catch their allies' attention to redirect troops wherever necessary. "

    [abilities]
        {ABILITY_LEADERSHIP}
    [/abilities]
    [defense]
        hills=40
        mountains=30
    [/defense]
    [resistance]
        blade=90
        pierce=90
        impact=110
    [/resistance]

    [leading_anim]
        start_time=-200
        [frame]
            image="unit_assests/Ibian_Great_Chief/Ibian_Great_Chief-featherlord-lead[1~4].png:75,unit_assests/Ibian_Great_Chief/Ibian_Great_Chief-featherlord.png:50"
        [/frame]
        halo_start_time=-100
        [halo_frame]
            halo="halo/misc/leadership-flare-[1~13].png:20"
            halo_x,halo_y=42,-42
        [/halo_frame]
    [/leading_anim]

    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
    [death]
        start_time=0
        [frame]
            image="unit_assests/Ibian_Great_Chief/Ibian_Great_Chief-featherlord-death[1~10].png:[100,50*9]"
        [/frame]
    [/death]

    {DEFENSE_ANIM "unit_assests/Ibian_Great_Chief/Ibian_Great_Chief-featherlord-hit[1~3].png:75" "unit_assests/Ibian_Great_Chief/Ibian_Great_Chief-featherlord.png" {SOUND_LIST:HUMAN_FEMALE_HIT} }

    [standing_anim]
        [frame]
            image="unit_assests/Ibian_Great_Chief/Ibian_Great_Chief-featherlord-idle[1~4].png:200"
        [/frame]
    [/standing_anim]
    [standing_anim]
        start_time=0

        submerge=0.01
        [frame]
            image="unit_assests/Ibian_Great_Chief/Ibian_Great_Chief-featherlord-fly[1~4].png:150"
        [/frame]
    [/standing_anim]
    [movement_anim]
        start_time=0
        [frame]
            image="unit_assests/Ibian_Great_Chief/Ibian_Great_Chief-featherlord-fly[1~4].png:150"
        [/frame]
    [/movement_anim]
    
    
    
    
    [idle_anim]
        {STANDARD_IDLE_FILTER}

        start_time=0
        [frame]
            image="unit_assests/Ibian_Great_Chief/Ibian_Great_Chief-featherlord-idling[1~5].png:100"
        [/frame]
    [/idle_anim]

    [attack]
        name=lance
        description=_"lance"
        type=pierce
        range=melee
        damage=16
        number=2
        icon=attacks/pike.png
    [/attack]

    [attack]
        name=falcon
        description=_"falcon"
        type=blade
        range=ranged
        damage=6
        number=4
        icon=attacks/claws-animal.png
    [/attack]

    [attack_anim]
        [filter_attack]
            name=lance
        [/filter_attack]
        offset=0.0~0.2,0.2~0.7,0.7~0.2,0.2~0.0
        start_time=-260
        [frame]
            image="unit_assests/Ibian_Great_Chief/Ibian_Great_Chief-featherlord-spear[1~5].png:100"
        [/frame]
        {SOUND:HIT_AND_MISS spear.ogg {SOUND_LIST:MISS} -25}
    [/attack_anim]

    [attack_anim]
        [filter_attack]
            name=falcon
        [/filter_attack]
        start_time=-500
        [frame]
            image="unit_assests/Ibian_Great_Chief/Ibian_Great_Chief-featherlord-hunt[1~9].png:[100*4,70*2,60,100*2]"
        [/frame]
        missile_start_time=-200
        [if]
            direction=nw,ne,n
            [missile_frame]
                halo="unit_assests/Ibian_Great_Chief/Ibian_Great_Chief-flockmaster-hunt-falcon[4,5].png:[150,50],unit_assests/Ibian_Great_Chief/Ibian_Great_Chief-flockmaster-hunt-falcon1.png~FL(horiz):100"
                offset=0.0~1.0,1.0~0.0
                halo_x=20~0:200,0~20:100
                halo_y=-20~0:200,0~-20:100
                auto_vflip=no
            [/missile_frame]
        [/if]
        [else]
            direction=sw,se,s
            [missile_frame]
                halo="unit_assests/Ibian_Great_Chief/Ibian_Great_Chief-flockmaster-hunt-falcon[1,2,3].png:[100,50*2],unit_assests/Ibian_Great_Chief/Ibian_Great_Chief-flockmaster-hunt-falcon4.png~FL(horiz):100"
                offset=0.0~1.0,1.0~0.0
                halo_x=20~0:200,0~20:100
                halo_y=-20~0:200,0~-20:100
                auto_vflip=no
            [/missile_frame]
        [/else]

        {SOUND:HIT_AND_MISS claws.ogg {SOUND_LIST:MISS} -25}
        [frame]
            image="unit_assests/Ibian_Great_Chief/Ibian_Great_Chief-featherlord.png:50"
        [/frame]
    [/attack_anim]
[/unit_type]
