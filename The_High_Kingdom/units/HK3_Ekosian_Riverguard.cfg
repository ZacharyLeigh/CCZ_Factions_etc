#textdomain wesnoth-The_High_Kingdom
[unit_type]
    id=Ekosian Riverguard
    name= _ "Ekosian Riverguard"
    race=high_kingdom
    image="unit_assests/initiate/sobek_64.png"
    image_icon="unit_assests/initiate/sobek_64.png~CROP(32,24,72,72)"
    profile="unit_assests/initiate/sobek_64.png"
    hitpoints=80
    movement_type=hk2_foot
    movement=5
    experience=150
    gender=male
    level=3
    alignment=chaotic
    advances_to=null #Ekosian Sobek
    {AMLA_ENDSINGER}
    cost=51
    usage=fighter

    # sobek should be the level 3, and the riverguard should be the level 2, lurk starts at level 2, leadership at level 3

    [abilities]
#        {ABILITY_LURK}
    [/abilities]
    description= _ "The seasoned unit_assests/initiate/Riverguard soldiers often come from former bandit crews. They lend their talent as mercenaries to various armed forces, who make good use of their ability to strike anywhere quickly. "
    
    [resistance]
        blade=90
        pierce=90
        impact=90
    [/resistance]
    [defense]
        deep_water=50
        shallow_water=40
        swamp=30
    [/defense]

    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
    [death]
        start_time=0
        [frame]
            image="unit_assests/initiate/Riverguard-death[1~6].png:100,50*5,unit_assests/initiate/Riverguard-death7.png:200"
        [/frame]
    [/death]
    {DEFENSE_ANIM "unit_assests/initiate/Riverguard-hit[1~3].png:75" "unit_assests/initiate/Riverguard-fly1.png" {SOUND_LIST:HUMAN_FEMALE_HIT} }
    [standing_anim]
        start_time=0
        [frame]
            image="unit_assests/initiate/Riverguard-stand[1~6].png:100"
        [/frame]
    [/standing_anim]
    [movement_anim]
        start_time=0
        [frame]
            image="unit_assests/initiate/Riverguard-fly[1~6].png:100"
        [/frame]
    [/movement_anim]
    [idle_anim]
        {STANDARD_IDLE_FILTER}
        start_time=0
        [frame]
            image="unit_assests/initiate/Riverguard-idling[1~7].png:[100*3,50*2,100*2]"
        [/frame]
    [/idle_anim]

    [attack]
        name=staff
        description=_"staff"
        type=impact
        range=melee
        damage=7
        number=3
        [specials]
            {WEAPON_SPECIAL_FIRSTSTRIKE}
        [/specials]
        icon=attacks/quarterstaff.png
    [/attack]

    [attack_anim]
        [filter_attack]
            name=staff
        [/filter_attack]
        direction=nw,ne,sw,se
        offset=0.0~0.2,0.2~0.5,0.5,0.5~0.2,0.2~0.0
        start_time=-400
        [frame]
            image="unit_assests/initiate/Riverguard-slash[1~11].png:75"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -75}
    [/attack_anim]
    
    [attack]
        name=curse
        description=_"curse"
        type=arcane
        range=ranged
        damage=10
        number=2
        [specials]
            {WEAPON_SPECIAL_MAGICAL}
        [/specials]
        icon=attacks/curse.png
    [/attack]

    [attack_anim]
        [filter_attack]
            name=lanceblade
        [/filter_attack]
        direction=n,s
        offset=0.0~0.2,0.2~0.5,0.5,0.5~0.2,0.2~0.0
        directional_x=0~-18:320,-18:160,-18~0:320
        start_time=-400
        [frame]
            image="unit_assests/initiate/Riverguard-slash[1~11].png:75"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -75}
    [/attack_anim]

    [attack_anim]
        [filter_attack]
            name=lancepierce
        [/filter_attack]
        offset=0.0~0.5:150,0.5:75,0.5~0.2:150,0.2~0.0:150
        start_time=-150
        [frame]
            image="unit_assests/initiate/Riverguard-stab[1~7].png:75"
        [/frame]
        {SOUND:HIT_AND_MISS spear.ogg {SOUND_LIST:MISS} -100}
    [/attack_anim]
[/unit_type]
