#textdomain wesnoth-The_High_Kingdom
[unit_type]
    id=Ekosian Apothecary
    name= _ "Ekosian Apothecary"
    race=high_kingdom
    image="unit_assests/Ekosian_Apothecary/Ekosian_Apothecary64.png"
    profile="unit_assests/Ekosian_Apothecary/Ekosian_Apothecary64.png"
    small_profile="unit_assests/Ekosian_Apothecary/Ekosian_Apothecary64.png~CROP(0,0,478,560)"
    hitpoints=27
    movement_type=high_kingdom_foot
    movement=5
    experience=38
    gender=female,male
    level=1
    alignment=lawful
    advances_to=Ekosian Embalmer
    cost=14
    usage=healer

    description= _ "Ekosian apothecaries travel between settlements tending wounds and preparing balms. Respected for their craft, they often act as healers and preservers of traditional remedies."

    [defense]
        cave=70
        fungus=60
    [/defense]
    [movement_costs]
        cave=1
        fungus=1
    [/movement_costs]

    [abilities]
        {ABILITY_HEAL_4}
        {ABILITY_CURES}
    [/abilities]

    [standing_anim]
        [frame]
            image="unit_assests/Ekosian_Apothecary/Ekosian_Apothecary-stand[1~6].png:100"
        [/frame]
    [/standing_anim]

    [death]
        start_time=0
        [frame]
            image="unit_assests/Ekosian_Apothecary/Ekosian_Apothecary-death[1~4].png:100,unit_assests/Ekosian_Apothecary/Ekosian_Apothecary-deathb[5~6].png:100,unit_assests/Ekosian_Apothecary/Ekosian_Apothecary-deathb7.png:200"
        [/frame]
    [/death]
    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
    {DEFENSE_ANIM "unit_assests/Ekosian_Apothecary/Ekosian_Apothecary-defend[1~3,1].png:[75*3,1]" "unit_assests/Ekosian_Apothecary/Ekosian_Apothecary64.png" {SOUND_LIST:HUMAN_FEMALE_HIT} }
    [movement_anim]
        start_time=0
        [frame]
            image="unit_assests/Ekosian_Apothecary/Ekosian_Apothecary-stand[5,6,1~4].png:100"
        [/frame]
    [/movement_anim]

    [attack]
        name=knife
        description=_"knife"
        type=blade
        range=melee
        damage=3
        number=3
        icon=attacks/dagger-human.png
    [/attack]
    [attack]
        name=Embalming Fluid
        description=_"Embalming Fluid"
        icon=attacks/faerie-fire.png
        type=arcane
        range=ranged
        [specials]
            {WEAPON_SPECIAL_POISON}
        [/specials]
        damage=8
        number=2
    [/attack]

    [attack_anim]
        [filter_attack]
            name=knife
        [/filter_attack]
        direction=sw,se
        offset=0.0:160,0.0~0.2:80,0.2~0.7:80,0.7:160,0.7~0.2:80,0.2~0.0:80
        start_time=-320
        [frame]
            image="unit_assests/Ekosian_Apothecary/Ekosian_Apothecary-attack[1~8,2].png:80"
        [/frame]
        {SOUND:HIT_AND_MISS dagger-swish.wav {SOUND_LIST:MISS} -100}
    [/attack_anim]

    [attack_anim]
        [filter_attack]
            name=Embalming Fluid
        [/filter_attack]
        missile_start_time=-100
        [missile_frame]
            offset=1.0
            duration=350
            image=halo/elven/shaman-heal-halo-[1~7].png:50~BLEND(0,76,0,100%)
            #tint the projectile on the enemy pink
            auto_vflip=no
        [/missile_frame]
        start_time=-200
        [frame]
            image="unit_assests/Ekosian_Apothecary/Ekosian_Apothecary-ability[1~8].png:100"
        [/frame]
        {SOUND:HIT_AND_MISS magic-holy-miss-2.ogg magic-holy-miss-1.ogg -75}
        halo_start_time=-150
        [halo_frame]
            halo=halo/saurian-magic-halo-[1~7].png:60
            halo_x,halo_y=0,-12
            auto_vflip=no
        [/halo_frame]
        [frame]
            image="unit_assests/Ekosian_Apothecary/Ekosian_Apothecary64.png:50"
        [/frame]
    [/attack_anim]
[/unit_type]
