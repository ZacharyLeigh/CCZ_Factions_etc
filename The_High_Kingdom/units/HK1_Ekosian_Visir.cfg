#textdomain wesnoth-The_High_Kingdom
[unit_type]
    id=Ekosian Visir
    name= _ "Ekosian Visir"
    race=high_kingdom
    image="unit_assests/visir/visir64.png"
    #image_icon="visir/visir64.png~CROP(0,0,72,72)"
    profile="unit_assests/visir/visir64.png"
    #small_profile="visir/visir64.png~CROP(0,0,686,580)"
    hitpoints=29
    movement_type=high_kingdom_foot
    movement=5
    experience=49
    gender=female,male
    level=1
    alignment=lawful
    advances_to=Light Acolyte, Shadow Acolyte
    cost=18
    usage=mixed fighter

    [male]
        gender=male
        profile="unit_assests/visir/visir64.png"
        small_profile="unit_assests/visir/visir64.png~CROP(0,0,686,580)"
        die_sound={SOUND_LIST:HUMAN_DIE}
        {DEFENSE_ANIM "unit_assests/Ekosian_Visir/Ekosian_Visir-defend[1~3].png:75" "unit_assests/visir/visir64.png" {SOUND_LIST:HUMAN_HIT} }
        advances_to=Light Acolyte
    [/male]
    [female]
        advances_to=Shadow Acolyte
    [/female]

    description= _ "Ekosian visirs coordinate units with practiced signals and commanding presence. Skilled at directing troops and supporting assaults, they bolster allies with tactical calls and battlefield insight."

    die_sound={SOUND_LIST:HUMAN_DIE}
    [death]
        start_time=0
        [frame]
            image="unit_assests/Ekosian_Visir/Ekosian_Visir-death[1~10].png:[100,50*9]"
        [/frame]
    [/death]

    {DEFENSE_ANIM "unit_assests/Ekosian_Visir/Ekosian_Visir-defend[1~3].png:75" "unit_assests/visir/visir64.png" {SOUND_LIST:HUMAN_FEMALE_HIT} }

    [standing_anim]
        [frame]
            image="unit_assests/visir/visir-stand[1~4].png:200"
        [/frame]
    [/standing_anim]
    [standing_anim]
        start_time=0
        submerge=0.01
        [frame]
            image="unit_assests/visir/visir-stand[1~4].png:150"
        [/frame]
    [/standing_anim]
    [movement_anim]
        start_time=0
        [frame]
            image="unit_assests/visir/visir-move[1~4].png:150"
        [/frame]
    [/movement_anim]
    
    [idle_anim]
        {STANDARD_IDLE_FILTER}

        start_time=0
        [frame]
            image="unit_assests/visir/visir-idle[1~5].png:100"
        [/frame]
    [/idle_anim]

    [attack]
        name=Club
        description=_"Club"
        type=impact
        range=melee
        damage=4
        number=3
        icon=attacks/pike.png
    [/attack]

    [attack]
        name=Light Ray
        description=_"Light Ray"
        type=arcane
        range=ranged
    [specials]
            {WEAPON_SPECIAL_MAGICAL}
    [/specials]
        damage=4
        number=4
        icon=attacks/claws-animal.png
    [/attack]

    [attack_anim]
        [filter_attack]
            name=club
        [/filter_attack]
        offset=0.0~0.2,0.2~0.7,0.7~0.2,0.2~0.0
        start_time=-260
        [frame]
            image="unit_assests/visir/visir-spear[1~5].png:100"
        [/frame]
        {SOUND:HIT_AND_MISS spear.ogg {SOUND_LIST:MISS} -25}
    [/attack_anim]

    [attack_anim]
        [filter_attack]
            name=Light Ray
        [/filter_attack]
        start_time=-500
        [frame]
            image="unit_assests/visir/visir-ability[1~9].png:[100*4,70*2,60,100*2]"
        [/frame]
        missile_start_time=-200
        [if]
            direction=nw,ne,n
            [missile_frame]
                halo="halo/saurian-magic-halo-[1~7].png:60"
                offset=0.0~1.0,1.0~0.0
                halo_x=20~0:200,0~20:100
                halo_y=-20~0:200,0~-20:100
                auto_vflip=no
            [/missile_frame]
        [/if]
        [else]
            direction=sw,se,s
            [missile_frame]
                halo="halo/saurian-magic-halo-[1~7].png:60"
                offset=0.0~1.0,1.0~0.0
                halo_x=20~0:200,0~20:100
                halo_y=-20~0:200,0~-20:100
                auto_vflip=no
            [/missile_frame]
        [/else]

        {SOUND:HIT_AND_MISS claws.ogg {SOUND_LIST:MISS} -25}
        [frame]
            image="unit_assests/visir/visir64.png:50"
        [/frame]
    [/attack_anim]
[/unit_type]
