#textdomain wesnoth-The_High_Kingdom
[unit_type]
    id=Big Beetle
    name= _ "Big Beetle"
    race=hk_scarab
    image="unit_assests/beetle/scarab64.png"
    image_icon="unit_assests/beetle/scarab64.png~CROP(0,8,72,72)"
    profile="unit_assests/beetle/scarab64.png"
    hitpoints=44
    movement_type=hk_beetle
    movement=5
    experience=47
    gender=male
    level=1
    alignment=chaotic
    advances_to=Scarab Rider
    cost=18
    usage=fighter

    description= _ "Massive beetles of the Ekosian wilds have been harnessed as shock troops; their carapaces blunt many blows while riders or handlers guide them into battle."

    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
    [death]
        start_time=0
        [frame]
            image="unit_assests/beetle/beetledeath[1~6].png:100,50*5,unit_assests/beetle/beetledeath7.png:200"
        [/frame]
    [/death]
    {DEFENSE_ANIM "unit_assests/beetle/beetlehit[1~3].png:75" "unit_assests/beetle/scarab64.png" {SOUND_LIST:HUMAN_FEMALE_HIT} }

    [standing_anim]
        start_time=0
        [frame]
            image="unit_assests/beetle/beetlestand[1~6].png:100"
        [/frame]
    [/standing_anim]
    [movement_anim]
        start_time=0
        [frame]
            image="unit_assests/beetle/beetlestand[1~6].png:100"
        [/frame]
    [/movement_anim]
    [idle_anim]
        {STANDARD_IDLE_FILTER}
        start_time=0
        [frame]
            image="unit_assests/beetle/beetleidle[1~9].png:100,unit_assests/beetle/beetlestand[4~6].png:100"
        [/frame]
    [/idle_anim]

    [attack]
        name=jaws
        description=_"Bite"
        type=blade
        range=melee
        damage=8
        number=2
        icon=attacks/fangs-bug.png
    [/attack]

    [attack_anim]
        [filter_attack]
            name=jaws
        [/filter_attack]
        offset=0.0~0.2,0.2~0.7,0.7~0.2,0.2~0.0
        start_time=-160
        [frame]
            image="unit_assests/beetle/beetleattack[1~4].png:100"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -25}
    [/attack_anim]
[/unit_type]
