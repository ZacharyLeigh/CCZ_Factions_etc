#textdomain wesnoth-The_High_Kingdom
[unit_type]
    id=Anuvian Hunter
    name= _ "Anuvian Hunter"
    race=high_kingdom
    image="unit_assests/hunter/hunter64.png"
    image_icon="unit_assests/hunter/hunter64.png~CROP(0,8,72,72)"
    profile="unit_assests/hunter/hunter64.png"
    hitpoints=29
    movement_type=high_kingdom_foot
    movement=6
    experience=40
    gender=female,male
    level=1
    alignment=lawful
    advances_to=Anuvian Pitati
    cost=15
    usage=archer

    description= _ "Ekosian hunters are nimble scouts who strike from range with hunting bows. Lightly armored, they trade endurance for speed and precision."

    [defense]
        forest=40
        hills=40
        mountains=40
    [/defense]
    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
    
    

    [standing_anim]
        start_time=0
        [frame]
            image="unit_assests/hunter/hunterstand[1~6].png:100"
        [/frame]
    [/standing_anim]
    [movement_anim]
        start_time=0
        [frame]
            image="unit_assests/hunter/hunterstand[1~6].png:100"
        [/frame]
    [/movement_anim]
    
    [attack]
        name=dagger
        description=_"dagger"
        type=blade
        range=melee
        damage=4
        number=2
        icon=attacks/dagger-curved.png
    [/attack]

    [attack_anim]
        [filter_attack]
            name=dagger
        [/filter_attack]
        offset=0.0~0.2,0.2~0.7,0.7~0.2,0.2~0.0
        start_time=-160
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -25}
    [/attack_anim]

    [attack]
        name=bow
        description=_"Hunting Bow"
        type=pierce
        range=ranged
        damage=9
        number=2
        icon=attacks/bow-short-reinforced.png
    [/attack]

    [attack_anim]
        [filter_attack]
            name=bow
        [/filter_attack]
        offset=0.0~0.2,0.2~0.7,0.7~0.2,0.2~0.0
        start_time=-160
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -25}
    [/attack_anim]
[/unit_type]
