#textdomain wesnoth-The_High_Kingdom
[unit_type]
    id=Avatar of Nephthys
    name= _ "Avatar of Nephthys"
    race=high_kingdom
    image="unit_assests/initiate/nephthys_64.png~CROP(24,8,120,136)"
    image_icon="unit_assests/initiate/nephthys_64.png~CROP(36,24,72,72)"
    profile="unit_assests/initiate/nephthys_64.png~CROP(24,8,120,136)"
    hitpoints=75
    movement_type=hk_deity #flying
    movement=8
    experience=250
    gender=female
    level=4
    alignment=chaotic
    advances_to=null
    {AMLA_ENDSINGER}
    cost=120
    usage=archer

    description= _ "after years of faithful devotion to nephthys, some Underlands are said to be blessed by the goddess herself, transformed into fiery avatars of her will."

    [abilities]
        {ABILITY_ILLUMINATES HALO="misc/halo-illuminates-fire.png"}
        #{ABILITY_HARPY_PHOENIX}
    [/abilities]
    [resistance]
        fire=0
        arcane=50
        cold=140
    [/resistance]
    [defense]
        unwalkable=40
    [/defense]
    die_sound=gryphon-die-1.ogg
    [death]
        start_time=0
        [frame]
            image="unit_assests/initiate/nephthys-death[1~19].png:100"
        [/frame]
    [/death]
    {DEFENSE_ANIM "unit_assests/initiate/nephthys-hit[1~4].png:[75*4]" "unit_assests/initiate/nephthys_64.png" {SOUND_LIST:HUMAN_FEMALE_HIT} }

    [standing_anim]
        start_time=0
        [frame]
            image="unit_assests/initiate/nephthys-float[1~7].png:150~CROP(24,8,120,136)"
        [/frame]
    [/standing_anim]
    [movement_anim]
        direction=s,se,sw
        start_time=0
        [frame]
            image="unit_assests/initiate/nephthys-move[8~11].png:100"
        [/frame]
    [/movement_anim]
    [movement_anim]
        direction=n,ne,nw
        start_time=0
        [frame]
            image="unit_assests/initiate/nephthys-move[8~11].png:100"
        [/frame]
    [/movement_anim]
    
    
    [idle_anim]
        {STANDARD_IDLE_FILTER}
        start_time=0
        [frame]
            image="unit_assests/initiate/nephthys-move[1~6].png:75,unit_assests/initiate/nephthys-idling[1~8].png:[100,75*4,100,50,100],unit_assests/initiate/nephthys-move[7,12~17].png:75"
        [/frame]
    [/idle_anim]
    [extra_anim]
        flag=phoenix_anim
        start_time=0
        [frame]
            image="unit_assests/initiate/nephthys-death[1~13].png:100,unit_assests/initiate/nephthys-rebirth[1~22].png:100,unit_assests/initiate/nephthys-float[6~7].png:150"
        [/frame]
    [/extra_anim]

    [attack]
        name=smite
        description=_"smite"
        type=impact
        range=melee
        damage=25
        number=2
        icon=attacks/fist-troll.png
    [/attack]
    
    [attack]
        name=firebreath
        description=_"firebreath"
        icon=attacks/fire-blast.png
        type=fire
        range=ranged
        [specials]
            #{WEAPON_SPECIAL_MAGICAL} incinerate
        [/specials]
        damage=33
        number=2
    [/attack]

    [attack_anim]
        [filter_attack]
            name=firebreath
        [/filter_attack]
        missile_start_time=-300
        [if]
            hits=yes
            [missile_frame]
                offset=1.0
                y=-10
                duration=600
                image="unit_assests/Light_Acolyte/Light_Acolyte-gust[1~9].png:100"
                auto_vflip=no
            [/missile_frame]
        [/if]
        [else]
            hits=no
            [missile_frame]
                offset=1.0
                y=-10
                duration=600
                image="unit_assests/Light_Acolyte/Light_Acolyte-gust-fail[1~9].png:100"
                auto_vflip=no
            [/missile_frame]
        [/else]
        start_time=-400
        [frame]
            image="unit_assests/initiate/nephthys-sing[2~4].png:100"
            sound=magic-holy-miss-2.ogg
            #{SOUND:HIT_AND_MISS magic-holy-miss-2.ogg magic-holy-miss-1.ogg -100}
        [/frame]
        [frame]
            image="unit_assests/initiate/nephthys-sing[5~8].png:100"
        [/frame]
        {SOUND:HIT_AND_MISS magic-faeriefire.ogg magic-faeriefire-miss.ogg 0}
        halo_start_time=-350
        [halo_frame]
            halo=halo/saurian-magic-halo-[1~7].png:60
            halo_x,halo_y=0,-12
            auto_vflip=no
        [/halo_frame]
        [frame]
            image="unit_assests/initiate/nephthys-float1.png:50"
        [/frame]
    [/attack_anim]

    [attack]
        name=whirlwind
        description=_"whirlwind"
        icon=attacks/claws-animal.png
        type=impact
        range=ranged
        [specials]
            {WEAPON_SPECIAL_MAGICAL}
        [/specials]
        damage=20
        number=3
    [/attack]

    [attack_anim]
        [filter_attack]
            name=whirlwind
        [/filter_attack]
        direction=n,s
        offset=0.0:350,0.0~0.2:150,0.2~0.5:75,0.5:300,0.5~0.2:150,0.2~0.0:150
        directional_x=0:350,0~-10:325,-10:200,-10~0:300
        start_time=-550
        [frame]
            image="dukeofthenight/duke-of-the-night-slash[1~9].png:[100,150,100,150,75,100*2,200*2]"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -75}
    [/attack_anim]
[/unit_type]
