#textdomain wesnoth-The_High_Kingdom
[unit_type]
    id=Shearin Buccaneer
    name= _ "Shearin Buccaneer"
    race=high_kingdom
    image="unit_assests/Shearin_Buccaneer/Shearin_Buccaneer-pirate.png"
    image_icon="unit_assests/Shearin_Buccaneer/Shearin_Buccaneer-pirate-fly1.png~CROP(32,24,72,72)"
    profile="unit_assests/Shearin_Buccaneer/Shearin_Buccaneer-pirate.png"
    hitpoints=50
    movement_type=high_kingdom_foot
    movement=6
    experience=70
    gender=female,male
    level=2
    alignment=lawful
    advances_to=Harpy Raider
    cost=28
    usage=fighter

    description= _ "Oftentimes unit_assests/Shearin_Buccaneer/Shearin_Buccaneer warriors band together to attack trade ships. They use long pikes to attack in a safer way and stay out of reach of melee fighters with their wings. Pirate groups nest on isolated craggy islands where they store their loot before trading it with other unit_assests/Shearin_Buccaneer/Shearin_Buccaneer colonies. "

    [resistance]
        impact=100
    [/resistance]
    [defense]
        deep_water=50
    [/defense]
    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
    [death]
        start_time=0
        [frame]
            image="unit_assests/Shearin_Buccaneer/Shearin_Buccaneer-pirate-death[1~6].png:100,50*5,unit_assests/Shearin_Buccaneer/Shearin_Buccaneer-pirate-death7.png:200"
        [/frame]
    [/death]
    {DEFENSE_ANIM "unit_assests/Shearin_Buccaneer/Shearin_Buccaneer-pirate-hit[1~3,1].png:[75*3,1]" "unit_assests/Shearin_Buccaneer/Shearin_Buccaneer-pirate-fly1.png" {SOUND_LIST:HUMAN_FEMALE_HIT} }

    [standing_anim]
        start_time=0
        [frame]
            image="unit_assests/Shearin_Buccaneer/Shearin_Buccaneer-pirate-stand[1~6].png:100"
        [/frame]
    [/standing_anim]
    [movement_anim]
        start_time=0
        [frame]
            image="unit_assests/Shearin_Buccaneer/Shearin_Buccaneer-pirate-fly[1~6].png:100"
        [/frame]
    [/movement_anim]
    [idle_anim]
        {STANDARD_IDLE_FILTER}
        start_time=0
        [frame]
            image="unit_assests/Shearin_Buccaneer/Shearin_Buccaneer-pirate-idling[1~6].png:100"
        [/frame]
    [/idle_anim]

    [attack]
        name=sword
        description=_"sword"
        type=blade
        range=melee
        damage=10
        number=3
        icon=attacks/sword-human.png
    [/attack]

    [attack_anim]
        [filter_attack]
            name=sword
        [/filter_attack]
        offset=0.0~0.2,0.2~0.7,0.7,0.7~0.2,0.2~0.0
        start_time=-325
        [frame]
            image="unit_assests/Shearin_Buccaneer/Shearin_Buccaneer-pirate-slash[1~9].png:75"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -75}
    [/attack_anim]

[/unit_type]
