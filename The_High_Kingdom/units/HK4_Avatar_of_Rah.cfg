#textdomain wesnoth-The_High_Kingdom
[unit_type]
    id=Avatar of Rah
    name= _ "Avatar of Rah"
    race=high_kingdom
    image="unit_assests/initiate/Avatar_of_Rah.png~CROP(24,8,120,136)"
    image_icon="unit_assests/initiate/Avatar_of_Rah.png~CROP(36,24,72,72)"
    profile="unit_assests/initiate/Avatar_of_Rah.png~CROP(24,8,120,136)"
    hitpoints=75
    movement_type=hk_deity
    movement=6
    experience=250
    gender=male
    level=4
    alignment=lawful
    advances_to=null
    {AMLA_ENDSINGER}
    cost=120
    usage=archer

    description= _ "It is said Underlands lived forever in their island of mists. But as they left it to gain true flesh and blood, their everlasting youth was lost, and some sought to reclaim it."

    [abilities]
        {ABILITY_ILLUMINATES HALO="misc/halo-illuminates-fire.png"}
        #{ABILITY_HARPY_PHOENIX}
    [/abilities]
    [resistance]
        fire=0
        arcane=50
        cold=140
    [/resistance]
    [defense]
        unwalkable=40
    [/defense]
    die_sound=gryphon-die-1.ogg
    [death]
        start_time=0
        [frame]
            image="unit_assests/initiate/Avatar_of_Rah-death[1~19].png:100"
        [/frame]
    [/death]
    {DEFENSE_ANIM "unit_assests/initiate/Avatar_of_Rah-hit[1~4].png:[75*4]" "unit_assests/initiate/Avatar_of_Rah.png" {SOUND_LIST:HUMAN_FEMALE_HIT} }

    [standing_anim]
        start_time=0
        [frame]
            image="unit_assests/initiate/Avatar_of_Rah-float[1~7].png:150~CROP(24,8,120,136)"
        [/frame]
    [/standing_anim]
    [movement_anim]
        direction=s,se,sw
        start_time=0
        [frame]
            image="unit_assests/initiate/Avatar_of_Rah-move[8~11].png:100"
        [/frame]
    [/movement_anim]
    [movement_anim]
        direction=n,ne,nw
        start_time=0
        [frame]
            image="unit_assests/initiate/Avatar_of_Rah-move[8~11].png:100"
        [/frame]
    [/movement_anim]
    
    
    [idle_anim]
        {STANDARD_IDLE_FILTER}
        start_time=0
        [frame]
            image="unit_assests/initiate/Avatar_of_Rah-move[1~6].png:75,unit_assests/initiate/Avatar_of_Rah-idling[1~8].png:[100,75*4,100,50,100],unit_assests/initiate/Avatar_of_Rah-move[7,12~17].png:75"
        [/frame]
    [/idle_anim]
    [extra_anim]
        flag=phoenix_anim
        start_time=0
        [frame]
            image="unit_assests/initiate/Avatar_of_Rah-death[1~13].png:100,unit_assests/initiate/Avatar_of_Rah-rebirth[1~22].png:100,unit_assests/initiate/Avatar_of_Rah-float[6~7].png:150"
        [/frame]
    [/extra_anim]

    [attack]
        name=smite
        description=_"smite"
        type=impact
        range=melee
        damage=25
        number=2
        icon=attacks/fist-troll.png
    [/attack]

    [attack_anim]
        [filter_attack]
            name=smite 
        [/filter_attack]
        direction=n,s
        offset=0.0:350,0.0~0.2:150,0.2~0.5:75,0.5:300,0.5~0.2:150,0.2~0.0:150
        directional_x=0:350,0~-10:325,-10:200,-10~0:300
        start_time=-550
        [frame]
            image="unit_assests/initiate/Avatar_of_Rah-death[1~13].png:100,unit_assests/initiate/Avatar_of_Rah-rebirth[1~22].png:100,unit_assests/initiate/Avatar_of_Rah-float[6~7].png:150"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -75}
    [/attack_anim]
    
    [attack]
        name=Sunstrike
        description=_"Sunstrike"
        icon=attacks/fire-blast.png
        type=fire
        range=ranged
        [specials]
            {WEAPON_SPECIAL_MAGICAL}
        [/specials]
        damage=24
        number=3
    [/attack]

    [attack_anim]
        [filter_attack]
            name=Sunstrike
        [/filter_attack]
        missile_start_time=-300
        [if]
            hits=yes
            [missile_frame]
                offset=1.0
                y=-10
                duration=600
                image="unit_assests/initiate/Avatar_of_Rah-gust[1~9].png:100"
                auto_vflip=no
            [/missile_frame]
        [/if]
        [else]
            hits=no
            [missile_frame]
                offset=1.0
                y=-10
                duration=600
                image="unit_assests/initiate/Avatar_of_Rah-gust-fail[1~9].png:100"
                auto_vflip=no
            [/missile_frame]
        [/else]
        start_time=-400
        [frame]
            image="unit_assests/initiate/Avatar_of_Rah-sing[2~4].png:100"
            sound=magic-holy-miss-2.ogg
            #{SOUND:HIT_AND_MISS magic-holy-miss-2.ogg magic-holy-miss-1.ogg -100}
        [/frame]
        [frame]
            image="unit_assests/initiate/Avatar_of_Rah-sing[5~8].png:100"
        [/frame]
        {SOUND:HIT_AND_MISS magic-faeriefire.ogg magic-faeriefire-miss.ogg 0}
        halo_start_time=-350
        [halo_frame]
            halo=halo/saurian-magic-halo-[1~7].png:60
            halo_x,halo_y=0,-12
            auto_vflip=no
        [/halo_frame]
        [frame]
            image="unit_assests/initiate/Avatar_of_Rah-float1.png:50"
        [/frame]
    [/attack_anim]
[/unit_type]
