#textdomain wesnoth-The_High_Kingdom
[unit_type]
    id=Ekosian Soldier
    name= _ "Ekosian Soldier"
    race=high_kingdom
    image="unit_assests/soldier/E_soldier64.png"
    image_icon="unit_assests/soldier/E_soldier64.png~CROP(0,8,72,72)"
    profile="unit_assests/soldier/E_soldier64.png"
    hitpoints=35
    movement_type=hk1_foot
    movement=5
    experience=36
    gender=female,male
    level=1
    alignment=lawful
    advances_to=Ekosian Warrior
    cost=15
    usage=fighter

    description= _ "Ekosian soldiers are agile frontline warriors who augment their speed with short blades. Their light gambeson provides modest protection while preserving mobility."

    [resistance]
        blade=110
    [/resistance]
    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
    [death]
        start_time=0
        [frame]
            image="unit_assests/soldier/E_soldier-death[1~6].png:100,50*5,unit_assests/soldier/E_soldier-death7.png:200"
        [/frame]
    [/death]
    {DEFENSE_ANIM "unit_assests/soldier/E_soldier-hit[1~3].png:75" "unit_assests/soldier/E_soldier-.png" {SOUND_LIST:HUMAN_FEMALE_HIT} }

    [standing_anim]
        start_time=0
        [frame]
            image="unit_assests/soldier/E_soldier-stand[1~6].png:100"
        [/frame]
    [/standing_anim]
    [movement_anim]
        start_time=0
        [frame]
            image="unit_assests/soldier/E_soldier-stand[1~6].png:100"
        [/frame]
    [/movement_anim]
    [idle_anim]
        {STANDARD_IDLE_FILTER}
        start_time=0
        [frame]
            image="unit_assests/soldier/E_soldier-idle[1~9].png:100,unit_assests/soldier/E_soldier-stand[4~6].png:100"
        [/frame]
    [/idle_anim]

    [attack]
        name=Khopesh
        description=_"Khopesh"
        type=blade
        range=melee
        damage=7
        number=3
        icon=attacks/sword-human.png
    [/attack]
    [attack_anim]
        [filter_attack]
            name=Khopesh
        [/filter_attack]
        offset=0.0~0.2,0.2~0.7,0.7~0.2,0.2~0.0
        start_time=-160
        [frame]
            image="unit_assests/soldier/E_soldier-attack[1~4].png:100"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -25}
    [/attack_anim]

    [attack]
        name=Sling
        description=_"Sling"
        type=impact
        range=ranged
        damage=3
        number=3
        icon=attacks/sling.png
    [/attack]
    [attack_anim]
        [filter_attack]
            name=Sling
        [/filter_attack]
        offset=0.0~0.2,0.2~0.7,0.7~0.2,0.2~0.0
        start_time=-160
        [frame]
            image="unit_assests/soldier/E_soldier-attack[1~4].png:100"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -25}
    [/attack_anim]

[/unit_type]

