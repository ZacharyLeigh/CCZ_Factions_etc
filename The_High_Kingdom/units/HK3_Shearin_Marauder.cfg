        [filter]
            [and]
                formula="if(self.hitpoints < self.max_hitpoints / 2, 1, 0)"
            [/and]
            [and]
                formula="if(self.hitpoints >= self.max_hitpoints / 4, 1, 0)"
            [/and]
        [/filter]
        )}
        {DEFENSE_ANIM_FILTERED "unit_assests/pirate/Shearin_Marauder-hit[2~4,2].png:[75*3,1]" "unit_assests/pirate/Shearin_Marauder.png:1" {SOUND_LIST:HUMAN_HIT}
