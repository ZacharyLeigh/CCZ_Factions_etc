{DEFENSE_ANIM_FILTERED "unit_assests/pirate/Shearin_Marauder-healthy-hit[1~4,1].png:[75*4,1]" "unit_assests/pirate/Shearin_Marauder-healthy-idle1.png:1" {SOUND_LIST:HUMAN_FEMALE_HIT}
