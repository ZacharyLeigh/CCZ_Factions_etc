#textdomain wesnoth-The_High_Kingdom
[unit_type]
    id=Shearin Marauder
    name= _ "Shearin Marauder"
    race=high_kingdom
    image="unit_assests/pirate/Shearin_Marauder.png"
    image_icon="unit_assests/pirate/Shearin_Marauder.png"
    profile="unit_assests/pirate/Shearin_Marauder.png"
    small_profile="unit_assests/pirate/Shearin_Marauder.png~CROP(170,0,760,608)"
    hitpoints=58
    movement_type=high_kingdom_foot
    movement=7
    experience=150
    gender=female,male
    level=3
    alignment=chaotic
    advances_to=null
    cost=60
    usage=fighter

    description= _ "Underlands whose love for birds is extreme spend their life with them, flying and hunting together. With their skilled calls they bring together small flocks of hawks to help them, directing them to reach their goal more efficiently. "

    #  all anims are filtered based on the unit's health level, to reflect the falcon flock whittling down with swarm. So there's 4 variations for each anim (except death)
    #  for the filters using two conditions (for scratched and wounded) be careful to place each formula in and /and tags

    [defense]
        flat=40
        hills=40
        mountains=30
        forest=50
    [/defense]

    [attack]
        name=claws
        description=_"talons"
        type=blade
        range=melee
        damage=9
        number=3
        icon=attacks/claws-animal.png
    [/attack]

    [attack]
        name=falcon
        description=_"falcon storm"
        type=blade
        range=ranged
        [specials]
            {WEAPON_SPECIAL_SWARM}
        [/specials]
        damage=5
        number=11
        icon=attacks/claws-animal.png
    [/attack]

    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
    [death]
        start_time=0
        [frame]
            image="unit_assests/pirate/Shearin_Marauder-death[1~11].png:[100,50*10]"
        [/frame]
    [/death]

    [male]
        gender=male
        profile="unit_assests/pirate/Shearin_Marauder.png"
        small_profile="unit_assests/pirate/Shearin_Marauder.png~CROP(170,0,760,608)"
        die_sound={SOUND_LIST:HUMAN_DIE}

        {DEFENSE_ANIM_FILTERED "unit_assests/pirate/Shearin_Marauder-healthy-hit[1~4,1].png:[75*4,1]" "unit_assests/pirate/Shearin_Marauder-healthy-idle1.png:1" {SOUND_LIST:HUMAN_HIT}
       (    
        [filter]
                formula="if(self.hitpoints >= self.max_hitpoints / 4*3, 1, 0)"
        [/filter]
        )}
        {DEFENSE_ANIM_FILTERED "unit_assests/pirate/Shearin_Marauder-scratched-hit[1~4,1].png:[75*4,1]" "unit_assests/pirate/Shearin_Marauder-scratched-idle1.png:1" {SOUND_LIST:HUMAN_HIT}
       (
        [filter]
            [and]
                formula="if(self.hitpoints < self.max_hitpoints / 4*3, 1, 0)"
            [/and]
            [and]
                formula="if(self.hitpoints >= self.max_hitpoints / 2, 1, 0)"
            [/and]
        [/filter]
    )}
        {DEFENSE_ANIM_FILTERED "unit_assests/pirate/Shearin_Marauder-wounded-hit[1~4,1].png:[75*4,1]" "unit_assests/pirate/Shearin_Marauder-wounded-idle1.png:1" {SOUND_LIST:HUMAN_HIT}
