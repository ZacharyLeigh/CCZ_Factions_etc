        [/missile2_frame]
        [missile3_frame]
            halo="unit_assests/pirate/Shearin_Marauder-falconeer-falconlunge[4,5].png:[100,50],unit_assests/pirate/Shearin_Marauder-falconeer-falconlunge1.png~FL(horiz):150"
            offset=0.0~1.0,1.0~0.0
            halo_x=20~0,0~20
            halo_y=-40~0,0~-40
            auto_vflip=no
        [/missile3_frame]
        [missile4_frame]
            halo="unit_assests/pirate/Shearin_Marauder-falconeer-falconlunge[4,5].png:[100,50],unit_assests/pirate/Shearin_Marauder-falconeer-falconlunge1.png~FL(horiz):150"
            offset=0.0~1.0,1.0~0.0
            halo_x=-20~0,0~-20
            halo_y=-20~0,0~-20
            auto_vflip=no
        [/missile4_frame]
    [/if]
    [else]
        direction=sw,se,s
        [missile_frame]
            halo="unit_assests/pirate/Shearin_Marauder-hunt-falcon[1,2,3].png:[50*3],unit_assests/pirate/Shearin_Marauder-hunt-falcon4.png~FL(horiz):150"
            offset=0.0~1.0,1.0~0.0
            halo_x=20~0,0~20
            halo_y=-20~0,0~-20
            auto_vflip=no
        [/missile_frame]
        [missile2_frame]
