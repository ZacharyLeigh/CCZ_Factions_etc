#textdomain wesnoth-The_High_Kingdom
[unit_type]
    id=Ekosian Shock Trooper
    name= _ "Ekosian Shock Trooper"
    race=high_kingdom
    image="unit_assests/soldier/shock_trooper64.png"
    image_icon="unit_assests/soldier/shock_trooper64.png~CROP(0,8,72,72)"
    profile="unit_assests/soldier/shock_trooper64.png"
    hitpoints=34
    movement_type=high_kingdom_foot
    movement=6
    experience=38
    gender=female,male
    level=3
    alignment=lawful
    advances_to=Ekosian Braveheart
    cost=33
    usage=fighter

    description= _ "Underlands can already cause harm with their sharp talons. However, those tasked to fight the colony's foes often reinforce their claws with small blades. Their light gambeson allows them to resist hits slightly better while retaining their kind's mobility. "

    [resistance]
        impact=100
    [/resistance]
    [defense]
        deep_water=0
    [/defense]
    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
    [death]
        start_time=0
        [frame]
            image="unit_assests/soldier/shock_trooper-death[1~6].png:100,50*5,unit_assests/soldier/shock_trooper-death7.png:200"
        [/frame]
    [/death]
    {DEFENSE_ANIM "unit_assests/soldier/shock_trooper-hit[1~3].png:75" "unit_assests/soldier/shock_trooper64.png" {SOUND_LIST:HUMAN_FEMALE_HIT} }

    [standing_anim]
        start_time=0
        [frame]
            image="unit_assests/soldier/shock_trooper-stand[1~6].png:100"
        [/frame]
    [/standing_anim]
    [movement_anim]
        start_time=0
        [frame]
            image="unit_assests/soldier/shock_trooper-fly[1~6].png:100"
        [/frame]
    [/movement_anim]
    [idle_anim]
        {STANDARD_IDLE_FILTER}
        start_time=0
        [frame]
            image="unit_assests/soldier/shock_trooper-idling[1~9].png:100,unit_assests/soldier/shock_trooper-fly[4~6].png:100"
        [/frame]
    [/idle_anim]

    [attack]
        name=sword
        description=_"sword"
        type=blade
        range=melee
        damage=7
        number=3
        icon=attacks/sword-human.png
    [/attack]

    [attack_anim]
        [filter_attack]
            name=sword
        [/filter_attack]
        offset=0.0~0.2,0.2~0.7,0.7~0.2,0.2~0.0
        start_time=-160
        [frame]
            image="unit_assests/soldier/shock_trooper[1~4].png:100"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -25}
    [/attack_anim]


    [attack]
        name=Javalin
        description=_"Javalin"
        type=blade
        range=melee
        damage=15
        number=1
        icon=attacks/spear-thrown.png
    [/attack]

    [attack_anim]
        [filter_attack]
            name=Javalin
        [/filter_attack]
        offset=0.0~0.2,0.2~0.7,0.7~0.2,0.2~0.0
        start_time=-160
        [frame]
            image="unit_assests/soldier/shock_trooper-javelin[1~4].png:100"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -25}
    [/attack_anim]
    
[/unit_type]
