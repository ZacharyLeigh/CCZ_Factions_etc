#textdomain wesnoth-The_High_Kingdom
[unit_type]
    id=Ekosian Warrior
    name= _ "Ekosian Warrior"
    race=high_kingdom
    image="unit_assests/soldier/e_spearman64.png"
    image_icon="unit_assests/soldier/e_spearman64.png~CROP(0,8,72,72)"
    profile="unit_assests/soldier/e_spearman64.png"
    hitpoints=34
    movement_type=high_kingdom_foot
    movement=6
    experience=38
    gender=female,male
    level=1
    alignment=lawful
    advances_to=Harpy Pirate
    cost=16
    usage=fighter

    description= _ "Underlands can already cause harm with their sharp talons. However, those tasked to fight the colony's foes often reinforce their claws with small blades. Their light gambeson allows them to resist hits slightly better while retaining their kind's mobility. "

    [resistance]
        impact=100
    [/resistance]
    [defense]
        deep_water=50
    [/defense]
    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
    [death]
        start_time=0
        [frame]
            image="unit_assests/Spearman/warrior-death[1~6].png:100,50*5,unit_assests/Spearman/warrior-death7.png:200"
        [/frame]
    [/death]
    {DEFENSE_ANIM "unit_assests/Spearman/warrior-hit[1~3].png:75" "unit_assests/Spearman/warrior-64.png" {SOUND_LIST:HUMAN_FEMALE_HIT} }

    [standing_anim]
        start_time=0
        [frame]
            image="unit_assests/Spearman/warrior-stand[1~6].png:100"
        [/frame]
    [/standing_anim]
    [movement_anim]
        start_time=0
        [frame]
            image="unit_assests/Spearman/warrior-fly[1~6].png:100"
        [/frame]
    [/movement_anim]
    [idle_anim]
        {STANDARD_IDLE_FILTER}
        start_time=0
        [frame]
            image="unit_assests/Spearman/warrior-idling[1~9].png:100,unit_assests/Spearman/warrior-fly[4~6].png:100"
        [/frame]
    [/idle_anim]

    [attack]
        name=lance
        description=_"lance"
        type=pierce
        range=melee
        damage=11
        number=2
        icon=attacks/lance.png
    [/attack]

    [attack_anim]
        [filter_attack]
            name=lance
        [/filter_attack]
        offset=0.0~0.2,0.2~0.7,0.7~0.2,0.2~0.0
        start_time=-260
        [frame]
            image="unit_assests/Ibian_Skirmisher/Ibian_Skirmisher-flagbearer-spear[1~5].png:100"
        [/frame]
        {SOUND:HIT_AND_MISS spear.ogg {SOUND_LIST:MISS} -25}
    [/attack_anim]
[/unit_type]
