#textdomain wesnoth-The_High_Kingdom
[unit_type]
    id=Ekosian Bast
    name= _ "Ekosian Bast"
    race=high_kingdom
    image="unit_assests/Ekosian_Bast/Ekosian_Bast-raptortongue-healthy.png"
    image_icon="unit_assests/Ekosian_Bast/Ekosian_Bast-raptortongue-healthy.png"
    profile="unit_assests/Ekosian_Bast/Ekosian_Bast-raptortongue-portrait-female2.webp"
    small_profile="unit_assests/Ekosian_Bast/Ekosian_Bast-raptortongue-portrait-female2.webp~CROP(0,0,415,623)"
    hitpoints=55
    movement_type=high_kingdom_foot
    movement=8
    experience=144
    gender=female
    level=3
    alignment=chaotic
    advances_to=null
    cost=48
    usage=scout

    description= _ "Over time falconeers efficiently learn the falcons' language. As the bird ages their tamer often will bring in new recruits for taming. "

    [defense]
        forest=70
        cave=70
        hills=60
        sand=60
        swamp=40
        snow=40
        ice=30
        plains=60
        shallow_water=20
        deep_water=0
    [/defense]
    [movement_costs]
        forest=1
        cave=1
        hills=1
        sand=1
        swamp=2
        snow=2
        ice=3
    [/movement_costs]

    [attack]
        name=claws
        description=_"talons"
        type=blade
        range=melee
        damage=7
        number=3
        icon=attacks/claws-animal.png
    [/attack]

    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
    [death]
        start_time=0
        [frame]
            image="unit_assests/Ekosian_Bast/Ekosian_Bast-raptortongue-death[1~9].png:[100,50*8]"
        [/frame]
    [/death]

[movement_anim]

    start_time=0
    [frame]
        image="unit_assests/Ekosian_Bast/Ekosian_Bast-raptortongue-wounded-fly[1~4].png:150"
    [/frame]
[/movement_anim]

[standing_anim]
    submerge=0.01
    [frame]
        image="unit_assests/Ekosian_Bast/Ekosian_Bast-raptortongue-healthy-stand[1~4].png:150"
    [/frame]
[/standing_anim]

[attack_anim]
    [filter_attack]
        name=claws
    [/filter_attack]
    [filter]
        formula="if(self.hitpoints >= self.max_hitpoints / 2, 1, 0)"
    [/filter]
    offset=0.0~0.2,0.2~0.7,0.7~0.2,0.2~0.0
    start_time=-260
    [frame]
        image="unit_assests/Ekosian_Bast/Ekosian_Bast-raptortongue-healthy[1~8].png:100"
    [/frame]
    {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -25}
[/attack_anim]

[/unit_type]
