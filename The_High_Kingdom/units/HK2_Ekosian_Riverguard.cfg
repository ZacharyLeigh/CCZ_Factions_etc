#textdomain wesnoth-The_High_Kingdom
[unit_type]
    id=Ekosian Riverguard
    name= _ "Ekosian Riverguard"
    race=high_kingdom
    image="raider/harpy-raider.png"
    image_icon="raider/harpy-raider-fly1.png~CROP(32,24,72,72)"
    profile="raider/harpy-raider.png"
    hitpoints=54
    movement_type=high_kingdom_foot
    movement=5
    experience=125
    gender=female,male
    level=2
    alignment=chaotic
    advances_to=Ekosian Sobek
    cost=35
    usage=fighter

    # sobek should be the level 3, and the riverguard should be the level 2, lurk starts at level 2, leadership at level 3

    [abilities]
#        {ABILITY_LURK}
    [/abilities]
    description= _ "The seasoned harpy soldiers often come from former bandit crews. They lend their talent as mercenaries to various armed forces, who make good use of their ability to strike anywhere quickly. "
    
    [resistance]
        blade=90
        pierce=90
        impact=90
    [/resistance]
    [defense]
        deep_water=50
        shallow_water=60
        swamp=60
    [/defense]

    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
    [death]
        start_time=0
        [frame]
            image="raider/harpy-raider-death[1~6].png:100,50*5,raider/harpy-raider-death7.png:200"
        [/frame]
    [/death]
    {DEFENSE_ANIM "raider/harpy-raider-hit[1~3].png:75" "raider/harpy-raider-fly1.png" {SOUND_LIST:HUMAN_FEMALE_HIT} }
    [standing_anim]
        start_time=0
        [frame]
            image="raider/harpy-raider-fly[1~6].png:100"
        [/frame]
    [/standing_anim]
    [movement_anim]
        start_time=0
        [frame]
            image="raider/harpy-raider-fly[1~6].png:100"
        [/frame]
    [/movement_anim]
    [idle_anim]
        {STANDARD_IDLE_FILTER}
        start_time=0
        [frame]
            image="raider/harpy-raider-idling[1~7].png:[100*3,50*2,100*2]"
        [/frame]
    [/idle_anim]

    [attack]
        name=staff
        description=_"staff"
        type=impact
        range=melee
        damage=7
        number=3
        [specials]
            {WEAPON_SPECIAL_FIRSTSTRIKE}
        [/specials]
        icon=attacks/pike.png
    [/attack]

    [attack]
        name=curse
        description=_"curse"
        type=arcane
        range=ranged
        damage=10
        number=2
        [specials]
            {WEAPON_SPECIAL_MAGICAL}
        [/specials]
        icon=attacks/pike.png
    [/attack]

    [attack_anim]
        [filter_attack]
            name=staff
        [/filter_attack]
        direction=nw,ne,sw,se
        offset=0.0~0.2,0.2~0.5,0.5,0.5~0.2,0.2~0.0
        start_time=-400
        [frame]
            image="raider/harpy-raider-slash[1~11].png:75"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -75}
    [/attack_anim]

    [attack_anim]
        [filter_attack]
            name=lanceblade
        [/filter_attack]
        direction=n,s
        offset=0.0~0.2,0.2~0.5,0.5,0.5~0.2,0.2~0.0
        directional_x=0~-18:320,-18:160,-18~0:320
        start_time=-400
        [frame]
            image="raider/harpy-raider-slash[1~11].png:75"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -75}
    [/attack_anim]

    [attack_anim]
        [filter_attack]
            name=lancepierce
        [/filter_attack]
        offset=0.0~0.5:150,0.5:75,0.5~0.2:150,0.2~0.0:150
        start_time=-150
        [frame]
            image="raider/harpy-raider-stab[1~7].png:75"
        [/frame]
        {SOUND:HIT_AND_MISS spear.ogg {SOUND_LIST:MISS} -100}
    [/attack_anim]
[/unit_type]
