#textdomain wesnoth-The_Deep
[unit_type]
    id=Scarab Rider
    name= _ "Scarab Rider"
    race=Deep
    image="parader/deep-parader.png"
    profile="parader/deep-parader.png"
    hitpoints=40
    movement_type=Deep_foot
    movement=6
    experience=100
    gender=female,male
    level=2
    alignment=lawful
    advances_to=Crawling Fortress
    cost=30
    usage=fighter

    description= _ "As they better their magical craft, some minstrels take delight in catching other's eyes. Switching focus from songs to dance, their plumage changes to reflect their spell-weaving. Paraders, on the opposite of captivators, mean to be noticed, and distract their foes to give their allies more opportunities. "
#    [abilities]
#        {ABILITY_SKIRMISHER}
#        {ABILITY_DIVERSION}
#    [/abilities]

    [defense]
        forest=50
        flat=40
        sand=60
        hills=50
        frozen=30
        shallow_water=20
        deep_water=0
    [/defense]

    [teaching_anim] #   used for diversion anim. by default teaching anim only works while affected enemy attacks so that cuts the animation short. to avoid my anim getting cut I just set the start time so that most of it plays before the hit occurs at time 0. The issue with this, is that the unit being distracted is stuck in its first attack frame if the resplendent deep's anim starts before it. To offset this, my anim is 600ms total, and i make it start 200ms later than it could (almost all mainline attack animations seem to start at least at -200, so it's likely the distraction anim will have time to finish, and it reduces potential waiting time).
        [filter]
            status=diversion
        [/filter]

        start_time=-400
        value_second=1
        [frame]
            image="parader/deep-parader-distraction[1~9].png:[75*2,50*2,75,50*4],parader/deep-parader-ensnare[17,18].png:[75*2]"
        [/frame]
    [/teaching_anim]
    [teaching_anim] #   flying version of the anim to reconnect with anims where deep is above water (idk any pre/post-teaching anim so there it goes)
        [filter]
            status=diversion
        [/filter]

        start_time=-400
        value_second=1
        [frame]
            image="parader/deep-parader-fly1.png:50,parader/deep-parader-distractionflight[1~10].png:[75*2,50*2,75,50*4,75],parader/deep-parader-fly6.png:50"
        [/frame]
    [/teaching_anim]

    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
    [death]
        start_time=0
        [frame]
            image="parader/deep-parader-death[1~7].png:100,50*6,parader/deep-parader-death8.png:200"
        [/frame]
    [/death]
    {DEFENSE_ANIM "parader/deep-parader-hit[1~3,1].png:[75*3,1]" "parader/deep-parader.png" {SOUND_LIST:HUMAN_FEMALE_HIT} }
    [standing_anim]
        [frame]
            image="parader/deep-parader.png"
        [/frame]
    [/standing_anim]
    [standing_anim]
        start_time=0

        submerge=0.01
        [frame]
            image="parader/deep-parader-fly[1~6].png:100"
        [/frame]
    [/standing_anim]
    [movement_anim]
        start_time=0
        [frame]
            image="parader/deep-parader-fly[1~6].png:100"
        [/frame]
    [/movement_anim]
    [pre_movement_anim]
        start_time=0

        [frame]
            image="parader/deep-parader-takeoff[1~3].png:75"
        [/frame]
    [/pre_movement_anim]
    [post_movement_anim]
        start_time=0

        [frame]
            image="parader/deep-parader-land[1,2].png:75"
        [/frame]
    [/post_movement_anim]
    [draw_weapon_anim]
        start_time=0

        [frame]
            image="parader/deep-parader-land[1,2].png:75"
        [/frame]
    [/draw_weapon_anim]
    [sheath_weapon_anim]
        start_time=0

        [frame]
            image="parader/deep-parader-takeoff[1~3].png:75"
        [/frame]
    [/sheath_weapon_anim]
    [idle_anim]
        {STANDARD_IDLE_FILTER}
        start_time=0

        [frame]
            image="parader/deep-parader-ensnare[1~4].png:[75*3,50], parader/deep-parader-idling[1~15].png:75"
        [/frame]
    [/idle_anim]

    [attack]
        name=horn
        description=_"horn"
        type=pierce
        range=melee
        [specials]
            {WEAPON_SPECIAL_CHARGE}
        [/specials]
        damage=16
        number=1
        icon=attacks/dagger-human.png
    [/attack]
    [attack]
        name=sling
        description=_"sling"
        type=impact
        range=ranged
        damage=8
        number=3
        icon=attacks/claws-animal.png
    [/attack]

    [attack_anim]
        [filter_attack]
            name=horn
        [/filter_attack]
        direction=s
        offset=0.0:350,0.0~0.7:200,0.7:250,0.7~0.0:200,0.0:75
        directional_x=0:350,0~-20:200,-20:250,-20~0:200,0:75
        start_time=-500
        [frame]
            image="parader/deep-parader-dagger[1~12].png:[100*2,150,100,50*2,100*2,50,100*2,75]"
        [/frame]
        {SOUND:HIT_AND_MISS dagger-swish.wav {SOUND_LIST:MISS} -50}
    [/attack_anim]

    [attack_anim]
        [filter_attack]
            name=sling
        [/filter_attack]
        missile_start_time=-100
        [missile_frame]
            offset=1.0
            duration=350
            image=halo/elven/shaman-heal-halo-[1~7].png:50~BLEND(0,76,0,100%)
            auto_vflip=no
        [/missile_frame]
        start_time=-800
        [frame]
            image="parader/deep-parader-ensnare[1~18].png:[75*3,50*2,75*10,50,75*2]"
        [/frame]
        {SOUND:HIT_AND_MISS magic-faeriefire.ogg magic-faeriefire-miss.ogg -75}
        halo_start_time=-400
        [frame]
            image="parader/deep-parader.png:1"
        [/frame]
    [/attack_anim]
[/unit_type]
