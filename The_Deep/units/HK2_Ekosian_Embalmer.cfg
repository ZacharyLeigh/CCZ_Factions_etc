#textdomain wesnoth-The_Deep
[unit_type]
    id=Ekosian Embalmer
    name= _ "Ekosian Embalmer"
    race=Deep
    image="captivator/deep-captivator.png"
    profile="captivator/deep-captivator-portrait.webp"
    small_profile="captivator/deep-captivator-portrait.webp~CROP(0,0,379,580)"
    halo=halo/elven/shyde-stationary-halo[1~6].png:150
    hitpoints=43
    movement_type=Deep_foot
    movement=5
    experience=80
    gender=female,male
    level=2
    alignment=chaotic
    advances_to=Preist of Anubis
    cost=25
    usage=healer

    description= _ "The voice of the most famous deep minstrels is said to be able to both break and mend hearts. People usually regard these stories as mere legends, but some of them suspect there is magic at work. The captivator's first aim is precisely to avoid that people think this.
They weave magic within their melodies, warping others' perception of the world and disguising their looks to better charm them. When their power is strong enough, their illusions start to occur from nearly inaudible sounds like low humming or breathing, allowing them to change how they look to please their audience."

    [defense]
        cave=70
        fungus=60
    [/defense]
    [movement_costs]
        cave=1
        fungus=1
    [/movement_costs]

    [abilities]
        #{ABILITY_EMBALM}
        {ABILITY_CURES}
    [/abilities]

    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
    [death]
        start_time=0
        [frame]
            image="captivator/deep-captivator-death[1~7].png:100,50*6,captivator/deep-captivator-death8.png:200"
        [/frame]
    [/death]
    {DEFENSE_ANIM "captivator/deep-captivator-hit[1~3].png:75" "captivator/deep-captivator.png" {SOUND_LIST:HUMAN_FEMALE_HIT} }
    [standing_anim]
        [frame]
            image="captivator/deep-captivator.png"
        [/frame]
    [/standing_anim]
    [standing_anim]
        start_time=0

        submerge=0.01
        [frame]
            image="captivator/deep-captivator-fly[1~6].png:100"
        [/frame]
    [/standing_anim]
    [movement_anim]
        start_time=0
        [frame]
            image="captivator/deep-captivator-fly[1~6].png:100"
        [/frame]
    [/movement_anim]
    [pre_movement_anim]
        start_time=0

        [frame]
            image="captivator/deep-captivator-takeoff.png:100"
        [/frame]
    [/pre_movement_anim]
    [post_movement_anim]
        start_time=0

        [frame]
            image="captivator/deep-captivator-land.png:100"
        [/frame]
    [/post_movement_anim]
    [draw_weapon_anim]
        start_time=0

        [frame]
            image="captivator/deep-captivator-land.png:100"
        [/frame]
    [/draw_weapon_anim]
    [sheath_weapon_anim]
        start_time=0

        [frame]
            image="captivator/deep-captivator-takeoff.png:100"
        [/frame]
    [/sheath_weapon_anim]
    [idle_anim]
        {STANDARD_IDLE_FILTER}
        start_time=0

        [frame]
            image="captivator/deep-captivator-idlingB[1~10].png:150"
        [/frame]
        halo_start_time=150
        [halo_frame]
            halo="misc/deep-twinkle[1~9].png:150"
            halo_x,halo_y=0,0
            auto_vflip=no
        [/halo_frame]
    [/idle_anim]

    [attack]
        name=knife
        description=_"knife"
        type=blade
        range=melee
        damage=5
        number=3
        icon=attacks/dagger-human.png
    [/attack]
    [attack]
        name=Embalming Fluid
        description=_"Embalming Fluid"
        icon=attacks/faerie-fire.png
        type=arcane
        range=ranged
        [specials]
            {WEAPON_SPECIAL_POISON}
        [/specials]
        damage=12
        number=2
    [/attack]

    [attack_anim]
        [filter_attack]
            name=knife
        [/filter_attack]
        direction=sw,se
        offset=0.0~0.2:80,0.2~0.5:80,0.5:160,0.5~0.2:80,0.2~0.0:80
        start_time=-160
        [frame]
            image="captivator/deep-captivator-dagger[1~6].png:80"
        [/frame]
        {SOUND:HIT_AND_MISS dagger-swish.wav {SOUND_LIST:MISS} -100}
    [/attack_anim]

    [attack_anim]
        [filter_attack]
            name=Embalming Fluid
        [/filter_attack]
        missile_start_time=-100
        [missile_frame]
            offset=1.0
            duration=350
            image=halo/elven/shaman-heal-halo-[1~7].png:50~BLEND(0,76,0,100%)
            auto_vflip=no
        [/missile_frame]
        start_time=-200
        [frame]
            image="captivator/deep-captivator-sing[1~8].png:100"
        [/frame]
        {SOUND:HIT_AND_MISS magic-holy-miss-2.ogg magic-holy-miss-1.ogg -75}
        halo_start_time=-150
        [frame]
            image="captivator/deep-captivator.png:50"
        [/frame]
    [/attack_anim]

[/unit_type]
