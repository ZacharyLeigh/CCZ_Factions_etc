#textdomain wesnoth-The_Deep
[unit_type]
    id=Ibian Skirmisher
    name= _ "Ibian Skirmisher"
    race=Deep
    image="flagbearer/deep-flagbearer-idleb1.png~CROP(0,0,72,72)"
    image_icon="flagbearer/deep-flagbearer-idleb1.png~CROP(0,0,72,72)"
    profile="flagbearer/deep-flagbearer-portrait-female-shortwing.webp"
    profile="flagbearer/deep-flagbearer-portrait-female-shortwing.webp~CROP(0,0,625,470)"
    hitpoints=48
    movement_type=Deep_foot
    movement=7
    experience=75
    gender=female,male
    level=2
    alignment=lawful
    advances_to=Deep Featherlord
    cost=35
    usage=mixed fighter

    [male]
        gender=male
        profile="flagbearer/deep-flagbearer-portrait-male-shortwing.webp"
        small_profile="flagbearer/deep-flagbearer-portrait-female-shortwing.webp~CROP(0,0,625,470)"
        die_sound={SOUND_LIST:HUMAN_DIE}
        {DEFENSE_ANIM "flagbearer/deep-flagbearer-hit[1~3].png:75" "flagbearer/deep-flagbearer-idleb1.png"  {SOUND_LIST:HUMAN_HIT} }
    [/male]

    description= _ "The habit of guiding their bird around gives Deep skills in observing and giving out orders, which are applicable in wide scale combat as well. Some falconeers take up the flag-bearing spear to lead their peers in battle, and while their fighting strength is lesser than others', the coordination they bring to the squadron makes it much more deadly. "

    [abilities]
        {ABILITY_LEADERSHIP}
    [/abilities]
    [defense]
        hills=40
        mountains=30
    [/defense]

    [leading_anim]
        start_time=-200
        [frame]
            image="flagbearer/deep-flagbearer-lead[1~4].png:75,flagbearer/deep-flagbearer-idleb1.png:50"
        [/frame]
        halo_start_time=-100
        [halo_frame]
            halo="halo/misc/leadership-flare-[1~13].png:20"
            halo_x,halo_y=40,-36
        [/halo_frame]
    [/leading_anim]

    [standing_anim]
        start_time=0
        [frame]
            image="flagbearer/deep-flagbearer-idleb[1~4].png:200"
        [/frame]
    [/standing_anim]
    [standing_anim]

        start_time=0
        [frame]
            image="flagbearer/deep-flagbearer-fly[1~4].png:150"
        [/frame]
    [/standing_anim]
    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
    [death]
        start_time=0
        [frame]
            image="flagbearer/deep-flagbearer-death[1~10].png:[100,50*9]"
        [/frame]
    [/death]

    {DEFENSE_ANIM "flagbearer/deep-flagbearer-hit[1~3].png:75" "flagbearer/deep-flagbearer-idleb1.png" {SOUND_LIST:HUMAN_FEMALE_HIT} }

    [movement_anim]
        start_time=0
        [frame]
            image="flagbearer/deep-flagbearer-fly[1~4].png:150"
        [/frame]
    [/movement_anim]
    [pre_movement_anim]

        start_time=0
        [frame]
            image="flagbearer/deep-flagbearer-takeoff[1~4].png:50"
        [/frame]
    [/pre_movement_anim]
    [post_movement_anim]

        start_time=0
        [frame]
            image="flagbearer/deep-flagbearer-land[1~2].png:50"
        [/frame]
    [/post_movement_anim]
    [draw_weapon_anim]
        start_time=0

        [frame]
            image="flagbearer/deep-flagbearer-land[1~2].png:50"
        [/frame]
    [/draw_weapon_anim]
    [sheath_weapon_anim]
        start_time=0

        [frame]
            image="flagbearer/deep-flagbearer-takeoff[1~4].png:50"
        [/frame]
    [/sheath_weapon_anim]
    [idle_anim]
        {STANDARD_IDLE_FILTER}

        start_time=0
        [frame]
            image="flagbearer/deep-flagbearer-hunt[1~3].png:100,flagbearer/deep-flagbearer-idling[1~13].png:100,flagbearer/deep-flagbearer-hunt[9~10].png:100"
        [/frame]
    [/idle_anim]

    [attack]
        name=lance
        description=_"lance"
        type=pierce
        range=melee
        damage=11
        number=2
        icon=attacks/pike.png
    [/attack]

    [attack]
        name=falcon
        description=_"falcon"
        type=blade
        range=ranged
        damage=6
        number=3
        icon=attacks/claws-animal.png
    [/attack]

    [attack_anim]
        [filter_attack]
            name=lance
        [/filter_attack]
        offset=0.0~0.2,0.2~0.7,0.7~0.2,0.2~0.0
        start_time=-260
        [frame]
            image="flagbearer/deep-flagbearer-spear[1~5].png:100"
        [/frame]
        {SOUND:HIT_AND_MISS spear.ogg {SOUND_LIST:MISS} -25}
    [/attack_anim]

    [attack_anim]
        [filter_attack]
            name=falcon
        [/filter_attack]
        start_time=-500
        [frame]
            image="flagbearer/deep-flagbearer-hunt[1~10].png:[100*4,50*4,100*2]"
        [/frame]
        missile_start_time=-200
        [if]
            direction=nw,ne,n
            [missile_frame]
                halo="falconeer/deep-falconeer-falconlunge[4,5].png:[150,50],falconeer/deep-falconeer-falconlunge1.png~FL(horiz):100"
                offset=0.0~1.0,1.0~0.0
                halo_x=20~0:200,0~20:100
                halo_y=-20~0:200,0~-20:100
                auto_vflip=no
            [/missile_frame]
        [/if]
        [else]
            direction=sw,se,s
            [missile_frame]
                halo="falconeer/deep-falconeer-falconlunge[1,2,3].png:[100,50*2],falconeer/deep-falconeer-falconlunge4.png~FL(horiz):100"
                offset=0.0~1.0,1.0~0.0
                halo_x=20~0:200,0~20:100
                halo_y=-20~0:200,0~-20:100
                auto_vflip=no
            [/missile_frame]
        [/else]

        {SOUND:HIT_AND_MISS claws.ogg {SOUND_LIST:MISS} -25}
        [frame]
            image="flagbearer/deep-flagbearer-idleb1.png:50"
        [/frame]
    [/attack_anim]
[/unit_type]
