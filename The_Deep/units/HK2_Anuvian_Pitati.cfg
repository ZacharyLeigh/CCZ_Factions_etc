#textdomain wesnoth-The_Deep
[unit_type]
    id=Anuvian Pitati
    name= _ "Anuvian Pitati"
    race=Deep
    image="bomber/deep-bomber.png"
    image_icon="bomber/deep-bomber.png~CROP(0,8,72,72)"
    profile="bomber/deep-bomber.png"
    hitpoints=47
    movement_type=Deep_foot
    movement=6
    experience=70
    gender=female,male
    level=2
    alignment=lawful
    advances_to=Ta-Seti Champion
    cost=30
    usage=archer

    description= _ "Anuvian Pitati are involved in more serious conflicts than simple defense of their colony and as such, they have upgraded their equipment, flying and throwing techniques. In addition to the classic rocks, they also use lighter, flaming projectiles, that earned them their current name."

    [defense]
        forest = 60
    [/defense]
    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
    [death]
        start_time=0
        [frame]
            image="bomber/deep-bomber-death[1~6].png:100,50*5,bomber/deep-bomber-death7.png:200"
        [/frame]
    [/death]
    {DEFENSE_ANIM "bomber/deep-bomber-hit[1~3].png:75" "bomber/deep-bomber.png:1" {SOUND_LIST:HUMAN_FEMALE_HIT} }

    [standing_anim]
        start_time=0
        [frame]
            image="bomber/deep-bomber-fly[1~6].png:100"
        [/frame]
    [/standing_anim]
    [movement_anim]
        start_time=0
        [frame]
            image="bomber/deep-bomber-fly[1~6].png:100"
        [/frame]
    [/movement_anim]
    [idle_anim]
        {STANDARD_IDLE_FILTER}
        start_time=0
        [frame]
            image="bomber/deep-bomber-fly1.png:100,bomber/deep-bomber-idling[1~12].png:75"
        [/frame]
    [/idle_anim]

    [attack]
        name=dagger
        description=_"dagger"
        type=blade
        range=melee
        damage=5
        number=3
        icon=attacks/claws-animal.png
    [/attack]
    [attack]
        name=Composite Bow
        description=_"Composite Bow"
        icon=attacks/rock_thrown.png
        type=pierce
        range=ranged
        [specials]
            {WEAPON_SPECIAL_MARKSMAN}
        [/specials]
        damage=12
        number=3
    [/attack]

    [attack_anim]
        [filter_attack]
            name=dagger
        [/filter_attack]
        offset=0.0~0.2,0.2~0.7,0.7~0.2,0.2~0.0
        start_time=-160
        [frame]
            image="bomber/deep-bomber-talons[1~4].png:100"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -25}
    [/attack_anim]

    [attack_anim]
        [filter_attack]
            name=Composite Bow
        [/filter_attack]
        start_time=-900
        offset=0
        sling_stone_start_time=-300
        [if]
            hits=yes
            [sling_stone_frame]
                halo="projectiles/stone.png:300"
                halo_y=30~10,10~0,0~-10,-10~0
                offset=0.0~1.0
            [/sling_stone_frame]
            [frame]
                image="bomber/deep-bomber-sling[1~9].png:100"
            [/frame]
            attack_sound_start_time=-400
            [attack_sound_frame]
                sound=sling-big.ogg
            [/attack_sound_frame]
        [/if]
        [else]
            hits=no
            [sling_stone_frame]
                halo="projectiles/stone.png:300"
                #halo_x=24~0
                halo_y=30~10,10~0,0~-10
                offset=0.0~1.5
            [/sling_stone_frame]
            [frame]
                image="bomber/deep-bomber-sling[1~9].png:100"
            [/frame]
            attack_sound_start_time=-400
            [attack_sound_frame]
                sound=sling-big-miss.ogg
            [/attack_sound_frame]
        [/else]
        [frame]
            image="bomber/deep-bomber-fly[1~6].png:100"
        [/frame]
    [/attack_anim]


[/unit_type]
