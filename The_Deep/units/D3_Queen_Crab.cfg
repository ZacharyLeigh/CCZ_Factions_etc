#textdomain wesnoth-The_Deep
[unit_type]
    id=Queen Crab
    name= _ "Queen Crab"
    race=Deep
    image="fighter/deep-fighter2.png"
    image_icon="fighter/deep-fighter2.png~CROP(0,8,72,72)"
    profile="fighter/deep-fighter2.png"
    hitpoints=90
    movement_type=Deep_foot
    movement=5
    experience=200
    gender=female,male
    level=3
    alignment=lawful
    advances_to=null
    cost=60
    usage=fighter

    description= _ "Stag Beatle Riders... Not quite as fast as horsemen on regular terrain, but a bit tougher, and better at dealing with rocks, hills, and brambles."

    [movement_costs]
        forest=1
        hills=1
        mountains=2
        village=2
    [/movement_costs]
    [resistance]
        blade=130
        pierce=120
        impact=110
        fire=100
        cold=90
    [/resistance]
    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
    [death]
        start_time=0
        [frame]
            image="fighter/deep-fighter-death[1~6].png:100,50*5,fighter/deep-fighter-death7.png:200"
        [/frame]
    [/death]
    {DEFENSE_ANIM "fighter/deep-fighter-hit[1~3].png:75" "fighter/deep-fighter2.png" {SOUND_LIST:HUMAN_FEMALE_HIT} }

    [standing_anim]
        start_time=0
        [frame]
            image="fighter/deep-fighter-fly[1~6].png:100"
        [/frame]
    [/standing_anim]
    [movement_anim]
        start_time=0
        [frame]
            image="fighter/deep-fighter-fly[1~6].png:100"
        [/frame]
    [/movement_anim]
    [idle_anim]
        {STANDARD_IDLE_FILTER}
        start_time=0
        [frame]
            image="fighter/deep-fighter-idling[1~9].png:100,fighter/deep-fighter-fly[4~6].png:100"
        [/frame]
    [/idle_anim]

#   attack lifted from the core fire ant queen
    [attack]
        name=fangs
        description= _"fangs"
        icon=attacks/fangs-ant.png
        type=blade
        range=melee
        damage=10
        number=3
        [specials]
            {WEAPON_SPECIAL_PLAGUE_TYPE (Fire Ant Egg)}
            [+plague]
                special_note={INTERNAL:SPECIAL_NOTES_PLAGUE_EGG}
            [/plague]
        [/specials]
    [/attack]

    [attack]
        name=horn
        description=_"horn"
        type=pierce
        range=melee
        [specials]
            {WEAPON_SPECIAL_CHARGE}
        [/specials]
        damage=25
        number=1
        icon=attacks/claws-animal.png
    [/attack]

    [attack]
        name=lance
        description=_"lance"
        type=pierce
        range=melee
        damage=15
        number=2
        icon=attacks/claws-animal.png
    [/attack]

    [attack]
        name=catapult
        description=_"catapult"
        type=impact
        range=ranged
        damage=18
        number=2
        icon=attacks/claws-animal.png
    [/attack]

    [attack_anim]
        [filter_attack]
            name=horn
        [/filter_attack]
        offset=0.0~0.2,0.2~0.7,0.7~0.2,0.2~0.0
        start_time=-160
        [frame]
            image="fighter/deep-fighter-talons[1~4].png:100"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -25}
    [/attack_anim]
[/unit_type]
