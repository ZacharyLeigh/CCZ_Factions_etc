#textdomain wesnoth-The_Deep
[unit_type]
    id=Atlantean Ambassador
    name= _ "Atlantean Ambassador"
    race=Deep
    image="raider/deep-raider.png"
    image_icon="raider/deep-raider-fly1.png~CROP(32,24,72,72)"
    profile="raider/deep-raider.png"
    hitpoints=40
    movement_type=Deep_foot
    movement=7
    experience=60
    gender=female,male
    level=2
    alignment=neutral
    advances_to=Atlantean Senator
    cost=20
    usage=fighter mixed

    [abilities]
        #{ABILITY_PROTECTOR}
    [/abilities]
    description= _ "The seasoned deep soldiers often come from former bandit crews. They lend their talent as mercenaries to various armed forces, who make good use of their ability to strike anywhere quickly. "
    
    [resistance]
        blade=110
        pierce=110
        impact=100
        fire=100
        cold=80
        arcane=80
    [/resistance]
    [defense]
        deep_water=40
        shallow_water=50
        swamp=50
    [/defense]

    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
    [death]
        start_time=0
        [frame]
            image="raider/deep-raider-death[1~6].png:100,50*5,raider/deep-raider-death7.png:200"
        [/frame]
    [/death]
    {DEFENSE_ANIM "raider/deep-raider-hit[1~3].png:75" "raider/deep-raider-fly1.png" {SOUND_LIST:HUMAN_FEMALE_HIT} }
    [standing_anim]
        start_time=0
        [frame]
            image="raider/deep-raider-fly[1~6].png:100"
        [/frame]
    [/standing_anim]
    [movement_anim]
        start_time=0
        [frame]
            image="raider/deep-raider-fly[1~6].png:100"
        [/frame]
    [/movement_anim]
    [idle_anim]
        {STANDARD_IDLE_FILTER}
        start_time=0
        [frame]
            image="raider/deep-raider-idling[1~7].png:[100*3,50*2,100*2]"
        [/frame]
    [/idle_anim]

    [attack]
        name=knife
        description=_"knife"
        type=pierce
        range=melee
        damage=5
        number=3
        icon=attacks/pike.png
    [/attack]

    [attack]
        name=crystal curse
        description=_"crystal curse"
        type=arcane
        range=ranged
        damage=8+-6+
        number=4
        [specials]
            {WEAPON_SPECIAL_MAGICAL}
        [/specials]
        icon=attacks/pike.png
    [/attack]

    [attack_anim]
        [filter_attack]
            name=knife
        [/filter_attack]
        direction=nw,ne,sw,se
        offset=0.0~0.2,0.2~0.5,0.5,0.5~0.2,0.2~0.0
        start_time=-400
        [frame]
            image="raider/deep-raider-slash[1~11].png:75"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -75}
    [/attack_anim]

    [attack_anim]
        [filter_attack]
            name=lanceblade
        [/filter_attack]
        direction=n,s
        offset=0.0~0.2,0.2~0.5,0.5,0.5~0.2,0.2~0.0
        directional_x=0~-18:320,-18:160,-18~0:320
        start_time=-400
        [frame]
            image="raider/deep-raider-slash[1~11].png:75"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -75}
    [/attack_anim]

    [attack_anim]
        [filter_attack]
            name=lancepierce
        [/filter_attack]
        offset=0.0~0.5:150,0.5:75,0.5~0.2:150,0.2~0.0:150
        start_time=-150
        [frame]
            image="raider/deep-raider-stab[1~7].png:75"
        [/frame]
        {SOUND:HIT_AND_MISS spear.ogg {SOUND_LIST:MISS} -100}
    [/attack_anim]
[/unit_type]
